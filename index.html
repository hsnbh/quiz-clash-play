<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quiz Clash</title>
<meta name="theme-color" content="#070A1F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Changa:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Russo+One&display=swap">
<style>
/* Layout: one phone-width game shell (max 460px), stacked full-height screens over a starfield + neon arena floor. Single dark arcade look by design. */
:root{
  --ink:#070A1F; --night:#0E1336; --panel:rgba(20,26,70,.78); --panel-2:rgba(30,36,96,.85);
  --line:rgba(128,146,255,.20); --text:#EEF1FF; --mute:#98A2D8; --faint:#5E6699;
  --cyan:#33E1FF; --magenta:#FF3DCB; --violet:#8B5CFF; --gold:#FFC83D; --orange:#FF8A00;
  --good:#2BE38B; --bad:#FF4D6A;
  --display:'Changa','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic','Changa',system-ui,sans-serif;
  --logo:'Russo One','Changa',Impact,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
svg{display:block}
#app{position:relative;height:100%;max-width:460px;margin-inline:auto;overflow:hidden;overflow:clip;isolation:isolate;
  background:
    radial-gradient(120% 55% at 50% -12%,#33208A 0%,rgba(51,32,138,0) 62%),
    radial-gradient(80% 45% at 105% 100%,rgba(255,61,203,.20),rgba(255,61,203,0) 60%),
    radial-gradient(70% 40% at -10% 85%,rgba(51,225,255,.14),rgba(51,225,255,0) 60%),
    linear-gradient(180deg,#0B1032,#070A1F 70%)}
@media (min-width:520px){#app{box-shadow:0 0 0 1px var(--line),0 30px 90px rgba(0,0,0,.65)}}
#stars,#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#stars{z-index:-2}
#confetti{z-index:60}
.floor{position:absolute;left:-60%;right:-60%;bottom:-8%;height:42%;z-index:-1;opacity:.55;
  background-image:linear-gradient(rgba(51,225,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,255,.22) 1px,transparent 1px);
  background-size:46px 46px;transform:perspective(320px) rotateX(64deg);transform-origin:bottom;
  -webkit-mask-image:linear-gradient(to top,#000 5%,transparent 80%);mask-image:linear-gradient(to top,#000 5%,transparent 80%);
  animation:floor 5s linear infinite}
@keyframes floor{to{background-position:0 46px}}

/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;padding-inline:16px;padding-block:14px 18px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.with-nav{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.screen.in{animation:screenIn .38s cubic-bezier(.2,.8,.2,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(16px) scale(.985)}}

/* nav */
.nav{position:absolute;bottom:0;left:0;right:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);
  padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,rgba(7,10,31,.98),rgba(9,12,38,.9));border-top:1px solid var(--line);backdrop-filter:blur(14px)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--faint);font:600 12px var(--display);position:relative;transition:color .2s}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--cyan)}
.nav button.on::before{content:"";position:absolute;top:-9px;width:34px;height:3px;border-radius:0 0 4px 4px;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}

/* shared bits */
.ic{width:20px;height:20px;flex:none}
.eyebrow{font:600 11px var(--display);letter-spacing:.06em;color:var(--mute)}
.av{width:46px;height:46px;border-radius:50%;padding:2.5px;flex:none;position:relative;
  background:conic-gradient(from 200deg,var(--cyan),var(--violet),var(--magenta),var(--cyan))}
.av.op{background:conic-gradient(from 20deg,var(--magenta),var(--violet),var(--orange),var(--magenta))}
.av svg{width:100%;height:100%;border-radius:50%}
.ai-chip{display:inline-flex;align-items:center;gap:3px;padding:1px 7px 1px 6px;border-radius:99px;font:700 10px var(--display);letter-spacing:.04em;color:#08122A;background:linear-gradient(90deg,var(--cyan),#9AF3FF);direction:ltr;vertical-align:middle;white-space:nowrap}
.ai-chip svg{width:11px;height:11px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.card{background:linear-gradient(170deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 12px 30px rgba(0,0,0,.3)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:18px;font:700 17px var(--display);transition:transform .08s}
.btn.pressed{transform:translateY(3px)}
.btn-gold{color:#2A1400;background:linear-gradient(180deg,#FFE680,#FFB21E 55%,#FF8A00);box-shadow:0 5px 0 #A9530A,0 14px 28px rgba(255,160,0,.3),inset 0 2px 0 rgba(255,255,255,.65)}
.btn-gold.pressed{box-shadow:0 2px 0 #A9530A,inset 0 2px 0 rgba(255,255,255,.65)}
.btn-blue{color:#fff;background:linear-gradient(180deg,#5A7BFF,#3A44E0 60%,#2C2FB8);box-shadow:0 5px 0 #1C1E7A,0 12px 26px rgba(70,80,255,.3),inset 0 2px 0 rgba(255,255,255,.35)}
.btn-blue.pressed{box-shadow:0 2px 0 #1C1E7A,inset 0 2px 0 rgba(255,255,255,.35)}
.btn-ghost{color:var(--text);background:rgba(255,255,255,.04);border:1px solid var(--line)}
.btn-danger{color:#fff;background:linear-gradient(180deg,#FF6A80,#D8304E);box-shadow:0 5px 0 #7E1328}
.btn svg{width:20px;height:20px}

/* home */
.topbar{display:flex;align-items:center;gap:10px}
.me-chip{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:start}
.me-meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.me-meta b{font:700 16px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv{display:flex;align-items:center;gap:8px}
.lv em{font:700 12px var(--display);font-style:normal;color:var(--gold);direction:ltr}
.xpbar{width:96px;height:7px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.xpbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--gold),#FFE680)}
.streak{display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:99px;background:rgba(255,138,0,.12);border:1px solid rgba(255,170,60,.35);font:700 15px var(--display);color:#FFD27A}
.streak svg{width:17px;height:17px;color:var(--orange)}
.icon-btn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--mute)}
.icon-btn svg{width:20px;height:20px}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px}
.logo{direction:ltr;display:flex;flex-direction:column;align-items:center;line-height:.86;font-family:var(--logo);transform:skewX(-9deg) rotate(-3deg);position:relative}
.logo span{display:block;font-size:46px;letter-spacing:.5px;background-image:linear-gradient(180deg,#FFFFFF 15%,#CFD8FF 50%,#9A86FF 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #2A1B7A) drop-shadow(0 0 22px rgba(139,92,255,.55))}
.logo .l2{font-size:54px;margin-inline-start:34px;background-image:linear-gradient(180deg,#E6FDFF 10%,#5DEBFF 50%,#1F8BFF 100%);filter:drop-shadow(0 3px 0 #0B2F7A) drop-shadow(0 0 24px rgba(51,225,255,.55))}
.logo .bolt{position:absolute;right:-26px;top:-6px;width:30px;height:38px;color:var(--magenta);filter:drop-shadow(0 0 10px var(--magenta));transform:skewX(9deg)}
.tag{margin:4px 0 0;font:600 14px var(--display);color:var(--mute);text-align:center}
.rank-card{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:14px 16px;border-radius:24px;
  background:linear-gradient(160deg,rgba(74,58,190,.55),rgba(18,22,62,.82));border:1px solid rgba(139,92,255,.38);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 14px 34px rgba(0,0,0,.35)}
.rank-card .emb{width:96px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
.rank-card h2{margin:2px 0 0;font:800 26px/1.1 var(--display)}
.rank-card h2 small{display:block;font:600 13px var(--display);color:var(--mute)}
.rating{margin-top:6px;font:600 13px var(--body);color:var(--mute)}
.rating b{font:800 20px var(--display);color:var(--text);margin-inline-end:4px}
.prog{margin-top:8px;height:9px;border-radius:9px;background:rgba(0,0,0,.35);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.prog i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--violet),var(--cyan));box-shadow:0 0 12px rgba(51,225,255,.6);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.hint{display:block;margin-top:5px;font:500 12px var(--body);color:var(--faint)}
.play{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:14px;width:100%;padding:16px 20px 18px;border-radius:24px;color:#2A1400;
  background:linear-gradient(180deg,#FFE680,#FFB21E 52%,#FF8A00);box-shadow:0 7px 0 #A9530A,0 18px 36px rgba(255,160,0,.35),inset 0 2px 0 rgba(255,255,255,.7);transition:transform .08s}
.play.pressed{transform:translateY(5px);box-shadow:0 2px 0 #A9530A,inset 0 2px 0 rgba(255,255,255,.7)}
.play::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.play-ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:rgba(120,50,0,.18);box-shadow:inset 0 2px 4px rgba(120,50,0,.35)}
.play-ic svg{width:30px;height:30px}
.play b{display:block;font:800 28px/1 var(--display)}
.play small{display:block;margin-top:4px;font:600 13px var(--display);opacity:.75}
.play-txt{text-align:start}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:20px;text-align:start;background:linear-gradient(170deg,var(--panel-2),var(--panel));border:1px solid var(--line);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.tile.pressed{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.tile .tic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(51,225,255,.12);color:var(--cyan)}
.tile.v .tic{background:rgba(255,61,203,.12);color:var(--magenta)}
.tile .tic svg{width:21px;height:21px}
.tile b{font:700 16px var(--display)}
.tile small{font:500 12px/1.45 var(--body);color:var(--mute)}
.last{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.03);border:1px dashed var(--line);font:500 13px var(--body);color:var(--mute)}
.last b{color:var(--text);font-family:var(--display)}
.res-dot{width:9px;height:9px;border-radius:50%;flex:none}
.notice{display:flex;gap:10px;align-items:flex-start;font:500 12px/1.6 var(--body);color:var(--faint);padding-inline:4px}
.notice svg{width:16px;height:16px;flex:none;margin-top:2px}

/* matchmaking */
#s-match{align-items:center;justify-content:center;text-align:center;gap:22px}
.radar{position:relative;width:240px;height:240px;max-width:100%;display:grid;place-items:center}
.radar .ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(51,225,255,.35);animation:ripple 2.2s ease-out infinite}
.radar .ring:nth-child(2){animation-delay:.73s}.radar .ring:nth-child(3){animation-delay:1.46s}
@keyframes ripple{from{transform:scale(.35);opacity:1}to{transform:scale(1);opacity:0}}
.radar .sweep{position:absolute;inset:8%;border-radius:50%;background:conic-gradient(from 0deg,rgba(51,225,255,.45),rgba(51,225,255,0) 28%);animation:spin 1.6s linear infinite;-webkit-mask:radial-gradient(circle,transparent 30%,#000 31%);mask:radial-gradient(circle,transparent 30%,#000 31%)}
@keyframes spin{to{transform:rotate(360deg)}}
.radar .av{width:96px;height:96px;padding:3px;z-index:1;box-shadow:0 0 40px rgba(51,225,255,.45)}
.mm-title{font:800 24px var(--display);margin:0}
.mm-sub{margin:0;font:500 14px var(--body);color:var(--mute);min-height:1.6em}
.mm-found{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 12px;border-radius:18px;animation:screenIn .4s}

/* VS */
#s-vs{padding:0;gap:0;overflow:hidden}
.vs-half{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 16px}
.vs-half.top{background:linear-gradient(160deg,rgba(255,61,203,.42),rgba(91,22,112,.25) 60%,transparent);clip-path:polygon(0 0,100% 0,100% 86%,0 100%);animation:slideL .55s cubic-bezier(.2,.9,.25,1.2) both}
.vs-half.bot{background:linear-gradient(-20deg,rgba(51,225,255,.38),rgba(26,40,140,.3) 60%,transparent);clip-path:polygon(0 14%,100% 0,100% 100%,0 100%);animation:slideR .55s .1s cubic-bezier(.2,.9,.25,1.2) both;margin-top:-9%}
@keyframes slideL{from{transform:translateX(-110%)}}
@keyframes slideR{from{transform:translateX(110%)}}
.vs-half .av{width:122px;height:122px;padding:4px;box-shadow:0 0 50px rgba(51,225,255,.4)}
.vs-half.top .av{box-shadow:0 0 50px rgba(255,61,203,.45)}
.vs-name{font:800 26px/1.1 var(--display);margin:0;display:flex;align-items:center;gap:8px}
.vs-meta{display:flex;align-items:center;gap:8px;font:600 13px var(--display);color:var(--mute)}
.vs-meta .mini-emb{width:26px}
.vs-title{font:500 13px var(--body);color:rgba(238,241,255,.8);margin:0}
.vs-badge{position:absolute;left:50%;top:50%;z-index:3;transform:translate(-50%,-50%);font:400 74px/1 var(--logo);font-style:italic;direction:ltr;
  background:linear-gradient(180deg,#FFF6C2,#FFC83D 50%,#FF7A00);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #7A2E00) drop-shadow(0 0 26px rgba(255,170,0,.7));animation:vsIn .5s .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes vsIn{from{transform:translate(-50%,-50%) scale(3);opacity:0}}
.flash{position:absolute;inset:0;z-index:4;background:#fff;opacity:0;pointer-events:none;animation:flash .5s .45s ease-out}
@keyframes flash{10%{opacity:.55}}

/* battle */
#s-battle{gap:12px}
.bhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.pcard{display:flex;align-items:center;gap:8px;min-width:0;position:relative}
.pcard.op{flex-direction:row-reverse}
.pcard .pinfo{display:flex;flex-direction:column;min-width:0}
.pcard.op .pinfo{align-items:flex-end}
.pname{display:flex;align-items:center;gap:5px;font:600 12px var(--display);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pscore{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}
.pcard.me .pscore{color:var(--cyan);text-shadow:0 0 18px rgba(51,225,255,.5)}
.pcard.op .pscore{color:#FF7BDF;text-shadow:0 0 18px rgba(255,61,203,.5)}
.pcard .av{width:48px;height:48px}
.ans-chip{position:absolute;top:-6px;z-index:2;padding:1px 7px;border-radius:99px;font:700 10px var(--display);background:var(--magenta);color:#fff;box-shadow:0 0 14px var(--magenta);animation:popIn .3s cubic-bezier(.2,1.6,.4,1)}
.pcard.op .ans-chip{inset-inline-end:-2px}
.res-badge{position:absolute;bottom:-4px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;z-index:2;border:2px solid var(--ink);animation:popIn .3s cubic-bezier(.2,1.6,.4,1)}
.pcard.op .res-badge{inset-inline-end:30px}.pcard.me .res-badge{inset-inline-start:30px}
.res-badge svg{width:12px;height:12px;color:#fff}
@keyframes popIn{from{transform:scale(0)}}
.timer{position:relative;width:64px;height:64px}
.timer svg{width:64px;height:64px;transform:rotate(-90deg)}
.timer .trk{stroke:rgba(255,255,255,.08)}
.timer .bar{stroke:var(--gold);stroke-linecap:round;transition:stroke .3s;filter:drop-shadow(0 0 6px currentColor)}
.timer.low .bar{stroke:var(--bad)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font:800 24px var(--display);font-variant-numeric:tabular-nums}
.timer.low b{color:var(--bad);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
.tug{height:8px;border-radius:99px;display:flex;overflow:hidden;background:linear-gradient(90deg,#FF3DCB,#B23BFF);box-shadow:0 0 14px rgba(255,61,203,.3)}
.tug i{display:block;height:100%;width:50%;background:linear-gradient(270deg,#33E1FF,#3A7BFF);box-shadow:0 0 14px rgba(51,225,255,.6);transition:width .7s cubic-bezier(.2,.8,.2,1);position:relative}
.tug i::after{content:"";position:absolute;inset-inline-end:-3px;top:-3px;width:6px;height:14px;border-radius:3px;background:#fff;box-shadow:0 0 10px #fff}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rpill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;font:700 13px var(--display);background:rgba(139,92,255,.16);border:1px solid rgba(139,92,255,.4);color:#CDBDFF}
.rpill svg{width:16px;height:16px}
.rpill.t-risk{background:rgba(255,77,106,.14);border-color:rgba(255,77,106,.45);color:#FF9DAE}
.rpill.t-safe{background:rgba(51,160,255,.14);border-color:rgba(51,160,255,.45);color:#9FD4FF}
.rpill.t-spec{background:rgba(196,92,255,.16);border-color:rgba(196,92,255,.45);color:#E3B5FF}
.pips{display:flex;gap:5px}
.pips i{width:20px;height:6px;border-radius:4px;background:rgba(255,255,255,.1)}
.pips i.ok{background:var(--good);box-shadow:0 0 8px var(--good)}
.pips i.no{background:var(--bad)}
.pips i.cur{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.qcard{position:relative;padding:18px 18px 20px;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:10px;border-radius:24px;
  background:linear-gradient(180deg,rgba(40,46,122,.92),rgba(20,24,68,.94));border:1px solid rgba(140,160,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 16px 34px rgba(0,0,0,.35)}
.qcard.in{animation:qIn .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes qIn{from{opacity:0;transform:scale(.92) translateY(10px)}}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cat{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--display);color:var(--mute)}
.cat svg{width:15px;height:15px;color:var(--cyan)}
.qno{font:600 12px var(--display);color:var(--faint)}
.qtext{margin:0;font:700 21px/1.55 var(--display);text-align:center;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;min-height:56px;border-radius:18px;text-align:start;
  border:1px solid rgba(140,160,255,.24);background:linear-gradient(180deg,rgba(32,38,104,.95),rgba(20,24,70,.95));box-shadow:0 5px 0 rgba(4,6,24,.7);font:600 17px/1.4 var(--body);
  transition:transform .08s,background .25s,opacity .25s;animation:optIn .35s cubic-bezier(.2,.9,.3,1.2) both}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
@keyframes optIn{from{opacity:0;transform:translateY(12px)}}
.opt.pressed:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 rgba(4,6,24,.7)}
.opt:disabled{cursor:default}
.opt .k{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;font:700 15px var(--display);background:rgba(255,255,255,.07);color:var(--mute)}
.opt .t{flex:1;min-width:0}
.opt.picked{border-color:var(--cyan);box-shadow:0 5px 0 rgba(4,6,24,.7),0 0 0 2px rgba(51,225,255,.5),0 0 22px rgba(51,225,255,.35)}
.opt.picked .k{background:var(--cyan);color:#06213A}
.opt.right{background:linear-gradient(180deg,#27D686,#129A5C);border-color:#7DFFC1;box-shadow:0 5px 0 #0A5A37,0 0 26px rgba(43,227,139,.45)}
.opt.right .k{background:rgba(255,255,255,.25);color:#fff}
.opt.wrong{background:linear-gradient(180deg,#F04B66,#B0233E);border-color:#FF9AAB;box-shadow:0 5px 0 #6A0F22;animation:shake .45s}
.opt.wrong .k{background:rgba(255,255,255,.22);color:#fff}
.opt.dim{opacity:.4}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.opmark{position:absolute;inset-inline-end:10px;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;padding:2px;background:var(--magenta);box-shadow:0 0 12px var(--magenta);animation:popIn .3s cubic-bezier(.2,1.6,.4,1)}
.opmark svg{width:100%;height:100%;border-radius:50%}
.mymark{position:absolute;left:44px;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;padding:2px;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.mymark svg{width:100%;height:100%;border-radius:50%}
.pop{position:absolute;z-index:5;font:800 22px var(--display);color:var(--gold);text-shadow:0 0 14px rgba(255,200,61,.7),0 2px 0 #7A3D00;pointer-events:none;animation:floatUp 1.1s ease-out forwards;direction:ltr}
@keyframes floatUp{from{opacity:0;transform:translateY(8px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.15)}to{opacity:0;transform:translateY(-34px) scale(1)}}
.bfoot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:4px}
.quit{display:flex;align-items:center;gap:6px;font:600 13px var(--display);color:var(--faint);padding:6px 8px}
.quit svg{width:16px;height:16px}
.opp-tactic{font:600 12px var(--display);color:var(--mute);display:flex;align-items:center;gap:6px}

/* overlay (round intros, tactic) */
.overlay{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px 16px;background:rgba(5,7,24,.76);backdrop-filter:blur(8px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.rintro{position:relative;width:100%;max-width:360px;text-align:center;padding:30px 22px 26px;border-radius:28px;overflow:hidden;
  background:linear-gradient(170deg,rgba(60,48,170,.95),rgba(18,20,64,.97));border:1px solid rgba(139,92,255,.5);box-shadow:0 0 60px rgba(139,92,255,.35);animation:rIn .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes rIn{from{transform:scale(.6) rotate(-4deg);opacity:0}}
.rintro .big-ic{width:78px;height:78px;margin:0 auto 10px;border-radius:24px;display:grid;place-items:center;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.rintro .big-ic svg{width:44px;height:44px}
.rintro .eyebrow{font-size:13px}
.rintro h2{margin:4px 0 8px;font:800 34px/1.1 var(--display)}
.rintro p{margin:0;font:500 15px/1.65 var(--body);color:rgba(238,241,255,.82)}
.rintro .rules{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.rintro .rules span{padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.08);font:600 13px var(--display)}
.rintro .bar{position:absolute;bottom:0;inset-inline-start:0;height:4px;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:drain linear forwards}
@keyframes drain{from{width:100%}to{width:0}}
.tactic{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;animation:rIn .45s cubic-bezier(.2,1.3,.4,1)}
.tactic h2{margin:0;text-align:center;font:800 26px var(--display)}
.tactic .sit{margin:0;text-align:center;font:500 14px var(--body);color:var(--mute)}
.tactic .sit b{color:var(--text)}
.tcards{display:grid;gap:10px}
.tcard{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;padding:14px;border-radius:20px;text-align:start;border:1.5px solid;box-shadow:0 5px 0 rgba(0,0,0,.45);transition:transform .1s}
.tcard.pressed{transform:translateY(3px)}
.tcard .ti{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff}
.tcard .ti svg{width:30px;height:30px}
.tcard b{display:block;font:800 19px var(--display)}
.tcard small{display:block;font:500 13px/1.45 var(--body);color:rgba(238,241,255,.75)}
.tcard .pts{font:800 22px/1 var(--display);text-align:center}
.tcard .pts small{display:block;font:600 11px var(--display);direction:inherit}
.t-risk{background:linear-gradient(160deg,rgba(255,77,106,.28),rgba(60,14,34,.9));border-color:rgba(255,100,120,.6)}
.t-risk .ti{background:linear-gradient(180deg,#FF7A5C,#E2264F)}
.t-safe{background:linear-gradient(160deg,rgba(51,160,255,.26),rgba(10,30,70,.9));border-color:rgba(80,180,255,.6)}
.t-safe .ti{background:linear-gradient(180deg,#4FC3FF,#1F6BFF)}
.t-spec{background:linear-gradient(160deg,rgba(196,92,255,.28),rgba(40,14,80,.9));border-color:rgba(200,120,255,.6)}
.t-spec .ti{background:linear-gradient(180deg,#D57BFF,#7A3BFF)}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.catbtn{text-align:center;line-height:1.3}
.catbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:16px;background:rgba(196,92,255,.12);border:1px solid rgba(200,120,255,.4);font:700 13px var(--display);box-shadow:0 4px 0 rgba(0,0,0,.4)}
.catbtn svg{width:24px;height:24px;color:#E3B5FF}
.ttimer{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.ttimer i{display:block;height:100%;background:var(--gold);animation:drain linear forwards;margin-inline-start:auto}
.reveal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.reveal .card{padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.reveal .card .av{width:52px;height:52px}

/* results */
#s-result{align-items:stretch;gap:14px}
.rhero{position:relative;overflow:hidden;margin-inline:-16px;padding-inline:16px;isolation:isolate;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px;text-align:center}
.rays{position:absolute;top:-60px;left:50%;width:340px;height:340px;margin-left:-170px;border-radius:50%;z-index:-1;
  background:repeating-conic-gradient(rgba(255,200,61,.16) 0 10deg,transparent 10deg 20deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:spin 24s linear infinite}
.rhero.lose .rays{background:repeating-conic-gradient(rgba(139,92,255,.12) 0 10deg,transparent 10deg 20deg)}
.crown{width:92px;height:72px;filter:drop-shadow(0 6px 18px rgba(255,170,0,.6));animation:crownIn .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes crownIn{from{transform:translateY(-40px) scale(.4) rotate(-20deg);opacity:0}}
.rword{margin:0;font:800 54px/1 var(--display);background:linear-gradient(180deg,#FFF6C2,#FFC83D 50%,#FF8A00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #7A3400)}
.rhero.lose .rword{background:linear-gradient(180deg,#E6E9FF,#9AA3D6);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 3px 0 #23285E)}
.rhero.draw .rword{background:linear-gradient(180deg,#E6FDFF,#33E1FF);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 3px 0 #0B2F7A)}
.rsub{margin:0;font:500 14px var(--body);color:var(--mute)}
.scoreline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:14px 16px}
.scoreline .side{display:flex;align-items:center;gap:10px;min-width:0}
.scoreline .side.op{flex-direction:row-reverse}
.scoreline .side b{font:800 30px var(--display);font-variant-numeric:tabular-nums}
.scoreline .side.me b{color:var(--cyan)}.scoreline .side.op b{color:#FF7BDF}
.scoreline .side span{display:block;font:600 12px var(--display);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scoreline .dash{font:700 16px var(--display);color:var(--faint)}
.scoreline .av{width:42px;height:42px}
.gains{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gain{padding:12px 8px;text-align:center;border-radius:18px}
.gain b{display:block;font:800 24px/1.1 var(--display);direction:ltr;font-variant-numeric:tabular-nums}
.gain small{font:600 12px var(--display);color:var(--mute)}
.up{color:var(--good)}.down{color:var(--bad)}.xp{color:var(--gold)}
.tierprog{padding:14px 16px;display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center}
.tierprog .emb{width:54px}
.tierprog .row{display:flex;justify-content:space-between;font:700 14px var(--display)}
.tierprog .row span{color:var(--mute);font-weight:600;font-size:12px}
.tierup{margin:0;text-align:center;font:800 16px var(--display);color:var(--gold);padding:10px;border-radius:16px;background:rgba(255,200,61,.1);border:1px solid rgba(255,200,61,.4);animation:popIn .5s cubic-bezier(.2,1.6,.4,1)}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rbtns .btn-gold{grid-column:1/-1;font-size:20px;padding:16px}
.review{padding:6px 14px}
.review summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:10px 0;font:700 15px var(--display)}
.review summary::-webkit-details-marker{display:none}
.review summary svg{width:18px;height:18px;transition:transform .2s;color:var(--mute)}
.review[open] summary svg{transform:rotate(-90deg)}
.ritem{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.ritem .st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;margin-top:2px}
.ritem .st svg{width:13px;height:13px;color:#fff}
.ritem p{margin:0}
.ritem .q{font:600 14px/1.55 var(--body)}
.ritem .a{margin-top:4px;font:500 13px/1.5 var(--body);color:var(--mute)}
.ritem .a b{color:var(--good);font-weight:700}
.ritem .a s{color:#FF8FA0}
.ritem .e{margin-top:4px;font:500 12.5px/1.6 var(--body);color:var(--faint)}

/* ranks / profile */
.page-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.page-h h1{margin:0;font:800 28px var(--display)}
.page-h p{margin:2px 0 0;font:500 13px var(--body);color:var(--mute)}
.ladder{display:flex;flex-direction:column;gap:10px}
.lrow{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-radius:20px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.lrow .emb{width:58px}
.lrow b{display:block;font:800 19px var(--display)}
.lrow small{font:500 12px var(--body);color:var(--mute)}
.lrow .rng{font:700 13px var(--display);color:var(--mute)}
.lrow.cur{background:linear-gradient(160deg,rgba(74,58,190,.5),rgba(18,22,62,.85));border-color:rgba(139,92,255,.6);box-shadow:0 0 30px rgba(139,92,255,.25)}
.lrow.cur .rng{color:var(--cyan)}
.here{display:inline-block;margin-top:3px;padding:1px 8px;border-radius:99px;background:var(--cyan);color:#06213A;font:700 11px var(--display)}
.lrow.locked{opacity:.55}
.sec-h{margin:6px 0 0;font:700 17px var(--display)}
.botlist{display:flex;flex-direction:column;gap:10px}
.botrow{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:18px}
.botrow .av{width:48px;height:48px}
.botrow b{font:700 16px var(--display)}
.botrow small{display:block;font:500 12px/1.4 var(--body);color:var(--mute)}
.wl{font:700 14px var(--display);direction:ltr;text-align:center}
.wl small{font:600 11px var(--display);color:var(--faint);direction:inherit}
.prof{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 16px}
.prof .av{width:104px;height:104px;padding:4px;box-shadow:0 0 40px rgba(51,225,255,.35)}
.namefield{display:flex;gap:8px;width:100%}
.namefield input{flex:1;min-width:0;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);font:700 17px var(--display);text-align:center;-webkit-user-select:text;user-select:text}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:100%}
.avgrid button{aspect-ratio:1;max-width:100%;border-radius:50%;padding:2px;background:rgba(255,255,255,.08)}
.avgrid button.on{background:conic-gradient(var(--cyan),var(--violet),var(--magenta),var(--cyan));box-shadow:0 0 14px rgba(51,225,255,.5)}
.avgrid svg{width:100%;height:100%;border-radius:50%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:12px 8px;text-align:center;border-radius:18px}
.stat b{display:block;font:800 22px/1.15 var(--display);font-variant-numeric:tabular-nums}
.stat small{font:600 11.5px var(--display);color:var(--mute)}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);font:500 14px var(--body)}
.hrow:last-child{border-bottom:0}
.hrow .sc{font:700 15px var(--display);direction:ltr}
.hrow .d{font:700 13px var(--display);direction:ltr;min-width:40px;text-align:end}
.empty{padding:18px;text-align:center;font:500 13px/1.6 var(--body);color:var(--faint)}
.settings{display:flex;flex-direction:column;gap:10px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--line);font:600 14px var(--display)}
.switch{width:50px;height:28px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.switch.on{background:var(--good)}
.switch.on::after{inset-inline-start:25px}

/* sheet */
.sheet-wrap{position:absolute;inset:0;z-index:40;background:rgba(3,5,18,.7);backdrop-filter:blur(4px);display:flex;align-items:flex-end;animation:fade .2s}
.sheet{width:100%;max-height:88%;overflow-y:auto;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;background:linear-gradient(180deg,#1A1F5A,#0D1136);border-top:1px solid rgba(139,92,255,.5);box-shadow:0 -20px 60px rgba(0,0,0,.5);animation:up .35s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:44px;height:5px;border-radius:5px;background:rgba(255,255,255,.2);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font:800 22px var(--display)}
.sheet .lead{margin:0 0 14px;font:500 14px/1.6 var(--body);color:var(--mute)}
.sheet .bots{display:flex;flex-direction:column;gap:10px}
.bcard{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px;border-radius:20px;text-align:start;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.bcard .av{width:56px;height:56px}
.bcard b{font:800 18px var(--display)}
.bcard p{margin:2px 0 8px;font:500 13px/1.5 var(--body);color:var(--mute)}
.traits{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font:600 11.5px var(--display);color:var(--faint)}
.meter{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.meter i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--magenta),var(--violet))}
.howlist{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.howitem{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:12px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.howitem .hi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff}
.howitem .hi svg{width:24px;height:24px}
.howitem b{font:800 16px var(--display)}
.howitem p{margin:2px 0 0;font:500 13px/1.6 var(--body);color:var(--mute)}
.confirm-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}

.toast{position:absolute;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:70;transform:translateX(-50%);padding:10px 18px;border-radius:99px;background:#1F2566;border:1px solid rgba(139,92,255,.5);font:600 14px var(--display);white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toast 2.4s forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}


/* interactive question visuals */
.qtext.sm{font-size:18px}
.opts.grid{grid-template-columns:1fr 1fr}
.opts.grid .opt{flex-direction:column;justify-content:center;min-height:84px;padding:12px 10px;text-align:center;gap:6px}
.opts.grid .opt .k{position:absolute;top:7px;inset-inline-start:7px;width:22px;height:22px;border-radius:7px;font-size:11px}
.opts.grid .opt .t{display:flex;justify-content:center;align-items:center;flex:none}
.opts.grid .opt svg{width:58px;height:58px}
.opts.grid .opmark{top:7px;inset-inline-end:7px;margin-top:0;width:26px;height:26px}
.tx{font:700 20px var(--display)}
.sw{display:flex;flex-direction:column;align-items:center;gap:5px}
.sw i{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 2px rgba(255,255,255,.22)}
.sw b{font:700 14px var(--display)}
.blob{display:grid;place-items:center;width:58px;height:58px;border-radius:46% 54% 50% 50%/55% 45% 55% 45%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.22),inset 0 4px 6px rgba(255,255,255,.35)}
.blob.res{background:rgba(255,255,255,.05);border:2px dashed rgba(255,200,61,.6);box-shadow:none;font:800 24px var(--display);color:var(--gold);transition:background .5s}
.blob.res.done{border-color:transparent;box-shadow:inset 0 -6px 0 rgba(0,0,0,.22),inset 0 4px 6px rgba(255,255,255,.35),0 0 24px rgba(255,255,255,.25);animation:popIn .45s cubic-bezier(.2,1.6,.4,1)}
.mixvis{display:flex;align-items:flex-start;justify-content:center;gap:8px}
.mixc{display:flex;flex-direction:column;align-items:center;gap:6px;font:600 13px var(--display);color:var(--mute);min-width:58px}
.mixvis em{font:800 26px/58px var(--display);font-style:normal;color:var(--faint)}
.pair{display:flex;align-items:center;gap:5px;direction:ltr}
.pair .blob{width:34px;height:34px}
.pair em{font:800 16px var(--display);font-style:normal;color:var(--mute)}
.stroop{text-align:center;font:800 56px/1.15 var(--display);text-shadow:0 3px 0 rgba(0,0,0,.35)}
.visbox{display:block;width:100%;height:auto;max-height:150px;background:rgba(0,0,0,.2);border-radius:16px}
.matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(100%,220px);margin:0 auto}
.mcell{aspect-ratio:1;max-width:100%;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--line);display:grid;place-items:center}
.mcell svg{width:84%;height:84%}
.mcell.q{border:2px dashed var(--gold);color:var(--gold);font:800 26px var(--display);background:rgba(255,200,61,.08)}
.mcell.ok{border:2px solid var(--good);box-shadow:0 0 16px rgba(43,227,139,.45);animation:popIn .4s cubic-bezier(.2,1.6,.4,1)}
.piecebox svg{display:block;width:min(100%,200px);height:auto;margin:0 auto}
.mirrorvis{display:flex;align-items:center;justify-content:center;gap:14px}
.mirrorvis .fr{width:96px;height:96px;border-radius:14px;background:rgba(0,0,0,.22);display:grid;place-items:center}
.mirrorvis .fr svg{width:84%;height:84%}
.mirrorvis .fr.q{border:2px dashed var(--gold);color:var(--gold);font:800 30px var(--display)}
.mline{width:5px;align-self:stretch;border-radius:4px;background:linear-gradient(180deg,#E8FAFF,#5DB8FF);box-shadow:0 0 14px #5DB8FF}
.mathx{text-align:center;font:800 38px/1.25 var(--display);font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 20px rgba(51,225,255,.35)}
.memrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.memcell{aspect-ratio:1;max-width:100%;border-radius:14px;background:rgba(0,0,0,.22);display:grid;place-items:center;border:1px solid var(--line)}
.memcell svg{width:78%;height:78%}
.memcell.hide{font:800 22px var(--display);color:var(--faint)}
.prebar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}

/* v3: language, credits, burn, store, ads, challenge */
#app[dir=ltr]{--display:'Changa',system-ui,sans-serif;--body:'IBM Plex Sans Arabic',system-ui,sans-serif}

.chip{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:99px;font:700 15px var(--display);white-space:nowrap}

.tile.wa .tic{background:rgba(37,211,102,.15);color:#3DDC84}

.adstrip{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border-radius:16px;background:linear-gradient(90deg,rgba(255,106,42,.16),rgba(255,106,42,.04));border:1px solid rgba(255,120,60,.35);font:600 13.5px var(--display);color:#FFD2B8;text-align:start}
.adstrip svg{width:20px;height:20px;color:#FF6A2A;flex:none}
.adstrip b{margin-inline-start:auto;padding:4px 10px;border-radius:99px;background:#FF6A2A;color:#2A0E00;font-size:12px;white-space:nowrap}
.burnbtn{display:flex;align-items:center;gap:6px;padding:8px 14px 8px 12px;border-radius:99px;font:800 14px var(--display);color:#2A0E00;background:linear-gradient(180deg,#FFC066,#FF6A2A);box-shadow:0 4px 0 #8A2E00,0 0 18px rgba(255,106,42,.45);transition:transform .08s,opacity .2s}
.burnbtn svg{width:18px;height:18px}
.burnbtn.pressed{transform:translateY(3px);box-shadow:0 1px 0 #8A2E00}
.burnbtn:disabled{opacity:.35;box-shadow:none;cursor:default}
.burnbtn .n{min-width:20px;height:20px;border-radius:99px;display:grid;place-items:center;background:rgba(42,14,0,.2);font-size:12px}
.qcard.burning{animation:burnOut .75s ease-in forwards}
.qcard.burning::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(0deg,rgba(255,90,20,.95),rgba(255,180,60,.6) 40%,transparent 75%);animation:flames .75s ease-in forwards;pointer-events:none}
@keyframes burnOut{40%{filter:brightness(1.4) saturate(1.4)}100%{opacity:0;transform:translateY(-14px) scale(.96);filter:blur(4px) brightness(1.8)}}
@keyframes flames{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
.opts.burning .opt{animation:fadeDown .5s ease-in forwards}
@keyframes fadeDown{to{opacity:0;transform:translateY(10px)}}
.burn-flash{position:absolute;inset:0;z-index:25;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(255,120,40,.45),transparent 60%);animation:fade .7s reverse forwards}
.ghost-chip{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:99px;font:700 10px var(--display);color:#062A12;background:linear-gradient(90deg,#3DDC84,#A8F5C8);white-space:nowrap}
.ghost-chip svg{width:11px;height:11px}
.store-bal{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 14px;font:800 40px var(--display)}
.store-bal svg{width:40px;height:40px;color:#FF6A2A;filter:drop-shadow(0 0 12px rgba(255,106,42,.6))}
.store-bal small{font:600 14px var(--display);color:var(--mute)}
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.pack{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px 12px;border-radius:18px;background:linear-gradient(170deg,rgba(255,106,42,.16),rgba(30,20,60,.9));border:1px solid rgba(255,120,60,.35);box-shadow:0 5px 0 rgba(0,0,0,.4)}
.pack.pressed{transform:translateY(3px)}
.pack svg{width:28px;height:28px;color:#FF6A2A}
.pack b{font:800 22px var(--display)}
.pack small{font:600 11px var(--display);color:var(--mute)}
.pack .price{margin-top:4px;padding:4px 10px;border-radius:99px;background:var(--gold);color:#2A1400;font:800 13px var(--display)}
.pack .tag{position:absolute;top:-9px;padding:2px 8px;border-radius:99px;background:var(--magenta);font:700 10px var(--display);color:#fff}
.proto{margin:10px 0 0;font:500 12px/1.6 var(--body);color:var(--faint);text-align:center}
.adscreen{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;background:#05060F;padding:16px;padding-block:calc(14px + env(safe-area-inset-top,0px)) 18px;animation:fade .25s}
.adtop{display:flex;justify-content:space-between;align-items:center;font:700 12px var(--display);color:var(--mute)}
.adtop .adlabel{padding:3px 8px;border-radius:6px;background:var(--gold);color:#2A1400}
.adclose{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);font:800 15px var(--display)}
.adclose svg{width:18px;height:18px}
.adbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;margin:16px 0;border-radius:24px;border:2px dashed rgba(255,255,255,.12);background:repeating-linear-gradient(45deg,rgba(255,255,255,.02) 0 14px,transparent 14px 28px)}
.adbody b{font:800 22px var(--display)}
.adbody p{margin:0;max-width:30ch;font:500 14px/1.6 var(--body);color:var(--mute)}
.adbar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.adbar i{display:block;height:100%;width:0;background:var(--gold);animation:fill linear forwards}
@keyframes fill{to{width:100%}}
.btn-wa{color:#05220F;background:linear-gradient(180deg,#5BF09B,#25D366 60%,#1DA851);box-shadow:0 5px 0 #0D6B35,0 12px 26px rgba(37,211,102,.25),inset 0 2px 0 rgba(255,255,255,.5);text-decoration:none}
.btn-wa.pressed{box-shadow:0 2px 0 #0D6B35}
.chprev{margin:0 0 12px;padding:12px 14px;border-radius:16px;background:rgba(37,211,102,.08);border:1px solid rgba(37,211,102,.3);font:500 14px/1.6 var(--body);white-space:pre-wrap;overflow-wrap:anywhere}
.chlink{display:block;margin:8px 0 12px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.3);font:500 11.5px/1.5 ui-monospace,monospace;color:var(--mute);direction:ltr;text-align:left;overflow-wrap:anywhere;-webkit-user-select:all;user-select:all}
.chhero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin-bottom:14px}
.chhero .av{width:84px;height:84px;padding:3px}
.chhero b{font:800 24px var(--display)}
.chhero .sc{font:800 40px var(--display);color:var(--gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:rgba(0,0,0,.3)}
.seg button{padding:8px 14px;border-radius:10px;font:700 14px var(--display);color:var(--mute)}
.seg button.on{background:var(--violet);color:#fff}
a.setrow{color:inherit;text-decoration:none}
.setrow .ic{color:var(--cyan)}

.screen>*{flex-shrink:0}
.xpbar{width:64px}
.gains{grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
.chname{display:flex;gap:8px;margin:0 0 12px}
.chname input{flex:1;min-width:0;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);font:700 16px var(--display);-webkit-user-select:text;user-select:text}
.chip.burns .plus svg{color:#2A0E00}

/* v4: shop, frames, emoji reactions */
.nav{grid-template-columns:repeat(4,1fr)}
@property --fa{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes frspin{to{--fa:360deg}}
.av.fr-gold,.av.op.fr-gold{padding:3.5px;background:conic-gradient(from 30deg,#FFF6C2,#FFC83D,#9A6400,#FFE680,#C98A00,#FFF6C2);box-shadow:0 0 14px rgba(255,200,61,.55)}
.av.fr-fire,.av.op.fr-fire{padding:3.5px;background:conic-gradient(from var(--fa),#FF2D00,#FFB000,#FF5A00,#FFE066,#FF2D00);box-shadow:0 0 16px rgba(255,90,0,.6);animation:frspin 1.6s linear infinite}
.av.fr-neon,.av.op.fr-neon{padding:3px;background:#5CF2FF;box-shadow:0 0 6px #5CF2FF,0 0 18px #33E1FF,0 0 30px rgba(255,61,203,.5);animation:neon 1.4s ease-in-out infinite alternate}
@keyframes neon{to{box-shadow:0 0 3px #5CF2FF,0 0 10px #33E1FF,0 0 16px rgba(255,61,203,.3)}}
.av.fr-diamond,.av.op.fr-diamond{padding:3.5px;background:conic-gradient(from var(--fa),#E0F7FF,#B388FF,#80DEEA,#FFFFFF,#F48FB1,#E0F7FF);box-shadow:0 0 16px rgba(179,136,255,.55);animation:frspin 5s linear infinite}
.emo{position:absolute;top:-12px;z-index:6;font-size:30px;line-height:1;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));animation:emo 1.5s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes emo{0%{transform:scale(0) rotate(-20deg);opacity:0}18%{transform:scale(1.35) rotate(8deg);opacity:1}35%{transform:scale(1) rotate(-4deg)}80%{opacity:1}100%{transform:translateY(-38px) scale(.9);opacity:0}}
.shtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.shtabs::-webkit-scrollbar{display:none}
.shtabs button{flex:none;padding:8px 14px;border-radius:99px;font:700 14px var(--display);color:var(--mute);background:rgba(255,255,255,.05);border:1px solid var(--line)}
.shtabs button.on{color:#fff;background:linear-gradient(180deg,#9A6BFF,#6A3BFF);border-color:transparent;box-shadow:0 0 16px rgba(139,92,255,.45)}
.pk{padding:14px;display:flex;flex-direction:column;gap:12px}
.pk.eqd{border-color:rgba(43,227,139,.55);box-shadow:0 0 22px rgba(43,227,139,.18)}
.pkhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pkhead b{display:block;font:800 17px var(--display)}
.pkhead small{display:block;font:500 12.5px/1.5 var(--body);color:var(--mute)}
.pricebtn{flex:none;padding:8px 14px;border-radius:12px;font:800 14px var(--display);color:#2A1400;background:linear-gradient(180deg,#FFE680,#FFB21E);box-shadow:0 3px 0 #A9530A}
.pricebtn.pressed{transform:translateY(2px);box-shadow:0 1px 0 #A9530A}
.owned{flex:none;display:inline-flex;align-items:center;gap:4px;font:700 13px var(--display);color:var(--good)}
.owned svg{width:14px;height:14px}
.avrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.avrow.six{grid-template-columns:repeat(6,1fr);gap:6px}
.avtile{position:relative;display:grid;place-items:center;padding:4px;border-radius:18px;background:rgba(0,0,0,.2);border:1px solid transparent}
.avtile .av{width:100%;height:auto;aspect-ratio:1;max-width:100%}
.avtile.on{border-color:var(--cyan);box-shadow:0 0 14px rgba(51,225,255,.35)}
.avtile.locked .av{filter:saturate(.7) brightness(.8)}
.lock{position:absolute;bottom:4px;inset-inline-end:4px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(7,10,31,.85);border:1px solid var(--line);color:var(--gold)}
.lock svg{width:13px;height:13px}
.eq{position:absolute;bottom:-6px;padding:1px 7px;border-radius:99px;background:var(--cyan);color:#06213A;font:700 10px var(--display);white-space:nowrap}
.frrow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.frtile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px;border-radius:16px;background:rgba(0,0,0,.2);border:1px solid transparent}

.sndrow small{font:500 12px var(--body);color:var(--mute)}
.sndrow .lock{position:static}
.play-s{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#06213A;background:linear-gradient(180deg,#7BEFFF,#33C9FF);box-shadow:0 3px 0 #0E5E86}
.play-s svg{width:18px;height:18px}
.eqbtn{width:auto;padding:8px 14px;font-size:14px}
.eqbtn.wide{width:100%}
.emorow{display:flex;justify-content:space-around;padding:10px 4px;border-radius:16px;background:rgba(0,0,0,.2);font-size:34px;line-height:1}
.emorow span{display:inline-block}
.emorow span.bump{animation:emo 1.2s ease-out}
.morelink{display:flex;align-items:center;gap:6px;font:700 13px var(--display);color:var(--cyan)}
.morelink svg{width:16px;height:16px}
.avgrid{grid-template-columns:repeat(auto-fill,minmax(44px,1fr))}

/* v5: touch-down feedback, swipe navigation, new logo */
button,a.btn,.catbtn{transition:transform .14s cubic-bezier(.2,.8,.2,1),box-shadow .14s,filter .14s,background .2s,color .2s}
.pressed{filter:brightness(1.15)}
:is(.icon-btn,.chip,.me-chip,.quit,.setrow,.morelink,.lang-btn,.catbtn,.avtile,.frtile,.play-s,.bcard,.howitem,.adstrip,.shtabs button,.seg button,.avgrid button,.emorow,.review summary).pressed{transform:scale(.95)}
.btn.pressed{transform:translateY(3px) scale(.985)}
.nav button{border-radius:16px}
.nav button svg{transition:transform .18s cubic-bezier(.2,1.6,.4,1)}
.nav button.pressed{background:rgba(51,225,255,.08)}

.nav button.on svg{transform:translateY(-1px) scale(1.08)}
.screen.with-nav{touch-action:pan-y}
.logo2{display:flex;align-items:center;gap:12px;direction:ltr}

.logo2 .mark svg{width:100%;height:100%}
.logo2 .logo span{font-size:40px}
.logo2 .logo .l2{font-size:46px;margin-inline-start:22px}
@keyframes markIn{from{transform:scale(.3) rotate(-25deg);opacity:0}}
@keyframes markFloat{50%{transform:translateY(-4px) rotate(-2deg)}}

/* v5: online play */
.live-chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px 1px 7px;border-radius:99px;font:800 10px var(--display);letter-spacing:.06em;color:#fff;background:linear-gradient(90deg,#FF2D55,#FF3DCB);vertical-align:middle;white-space:nowrap}

@keyframes livedot{to{opacity:.25}}
.tile.live{background:linear-gradient(160deg,rgba(255,45,85,.22),rgba(30,20,70,.92));border-color:rgba(255,61,140,.45)}

.roomcode{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 22px;border-radius:20px;background:rgba(0,0,0,.3);border:1px dashed rgba(255,200,61,.5)}

.roomcode b{font:800 34px/1.1 var(--display);letter-spacing:.22em;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(255,200,61,.4)}
#s-match .radar .av{width:96px;height:96px;padding:3px;z-index:1;box-shadow:0 0 40px rgba(51,225,255,.45)}

/* v6: region picker, category toggles, share card */
.rg-val{display:inline-flex;align-items:center;gap:6px;color:var(--cyan);font-size:13px}.rg-val svg{width:16px;height:16px}
.rglist{display:grid;gap:8px}.rglist .setrow{text-align:start}.rglist .setrow span{display:grid;gap:2px}.rglist small{color:var(--mute);font:500 12px var(--body,inherit)}

.cattog button{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);font:700 13px var(--display);color:var(--mute);transition:all .15s}

.cattog button.on{color:#fff;border-color:var(--cyan);background:rgba(51,225,255,.12)}

.cattog .all{grid-column:1/-1;justify-content:center}
.shareprev{display:block;width:100%;max-width:340px;margin:0 auto 14px;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.5)}

.sub-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;background:rgba(255,200,61,.14);color:var(--gold);font:700 11px var(--display);vertical-align:middle;margin-inline-start:4px}

.vs-sub{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mute);font:600 12px var(--display);margin:2px 0 0}

/* bitmap avatar art */

/* ================= v7: academy, trophies, new home ================= */
.nav{grid-template-columns:repeat(5,1fr)!important}
.nav button{font-size:11px}
.brand2{display:flex;justify-content:center;margin:-4px 0 -6px}

/* online card */

.soon-chip{justify-self:center;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:rgba(139,92,255,.16);border:1px dashed rgba(139,92,255,.6);color:#CDB8FF;font:700 12px var(--display)}
.soon-chip svg{width:14px;height:14px}
/* academy rail */

/* ---------------- sound engine (synthesized, layered, with reverb) ---------------- */
let AC=null,MASTER=null,REV=null,NOISE=null;
function ac(){
  if(!S.sound) return null;
  try{
    if(!AC){
      AC=new (window.AudioContext||window.webkitAudioContext)();
      const comp=AC.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
      MASTER=AC.createGain(); MASTER.gain.value=.85; MASTER.connect(comp).connect(AC.destination);
      REV=AC.createConvolver(); const len=AC.sampleRate*1.8, b=AC.createBuffer(2,len,AC.sampleRate);
      for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
      REV.buffer=b; const rg=AC.createGain(); rg.gain.value=.28; REV.connect(rg).connect(MASTER);
      NOISE=AC.createBuffer(1,AC.sampleRate,AC.sampleRate); const nd=NOISE.getChannelData(0); for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    }
    if(AC.state==='suspended') AC.resume();
    return AC;
  }catch(e){return null}
}
function route(node,pan,rev){
  let n=node;
  if(pan&&AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=pan;n.connect(p);n=p}
  n.connect(MASTER);
  if(rev){const g=AC.createGain();g.gain.value=rev;n.connect(g);g.connect(REV)}
}
function env(g,t0,vol,a,dur){g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+a);g.gain.exponentialRampToValueAtTime(.0001,t0+dur)}
function tone({type='sine',f,f2,at=0,dur=.2,vol=.2,a=.005,pan=0,rev=0,lp,lp2}){
  const t0=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  env(g,t0,vol,a,dur);o.connect(g);let n=g;
  if(lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(lp,t0);if(lp2)fl.frequency.exponentialRampToValueAtTime(lp2,t0+dur);g.connect(fl);n=fl}
  route(n,pan,rev);o.start(t0);o.stop(t0+dur+.05);
}
function hiss({at=0,dur=.2,vol=.2,type='bandpass',f=1000,f2,q=1,a=.005,pan=0,rev=0}){
  const t0=AC.currentTime+at,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NOISE;s.loop=true;fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f,t0);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  env(g,t0,vol,a,dur);s.connect(fl).connect(g);route(g,pan,rev);s.start(t0,Math.random()*.5);s.stop(t0+dur+.05);
}
function bell(f,at=0,vol=.12,dur=1.2,pan=0,rev=.5,ratio=3.5){
  const t0=AC.currentTime+at,c=AC.createOscillator(),m=AC.createOscillator(),mg=AC.createGain(),g=AC.createGain();
  c.frequency.value=f;m.frequency.value=f*ratio;mg.gain.setValueAtTime(f*2,t0);mg.gain.exponentialRampToValueAtTime(1,t0+dur*.8);
  m.connect(mg).connect(c.frequency);env(g,t0,vol,.003,dur);c.connect(g);route(g,pan,rev);
  c.start(t0);m.start(t0);c.stop(t0+dur+.05);m.stop(t0+dur+.05);
}

  tap(){if(!ac())return;tone({f:760,f2:1180,dur:.055,vol:.085,a:.002});hiss({dur:.018,vol:.035,type:'bandpass',f:3200,q:2})},

  whoosh(){if(!ac())return;hiss({dur:.55,vol:.2,f:260,f2:3800,q:1.3,a:.22,rev:.25})},

  coin(){if(!ac())return;bell(1568,0,.11,.5,-.1,.4,2);bell(2093,.08,.11,.9,.1,.5,2)},

    [523.25,659.25,783.99,1046.5,1318.5].forEach(f=>tone({type:'triangle',f,at:.42,dur:1.7,vol:.045,a:.03,rev:.7}));hiss({at:.4,dur:1.1,vol:.03,type:'highpass',f:9000,rev:.7,a:.1})},
  lose(){if(!ac())return;[392,349.23,311.13].forEach((f,i)=>tone({type:'triangle',f,at:i*.2,dur:.65,vol:.08,lp:1300,rev:.55}));tone({f:155.56,at:.55,dur:1.5,vol:.09,rev:.6})},

function applyLang(){

}
const TABS=['s-home','s-matches','s-ranks','s-shop','s-profile'];
function setNav(id){
  $('#nav').hidden=!TABS.includes(id);
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===id));
}
const curScreen=()=>{const v=[...document.querySelectorAll('.screen')].find(s=>!s.hidden);return v&&v.id};
function renderTab(id){if(id==='s-shop')renderShop();if(id==='s-home')renderHome();if(id==='s-matches')renderMatches();if(id==='s-ranks')renderRanks();if(id==='s-profile')renderProfile()}
// Side the next tab comes from: tabs run right-to-left in Arabic, left-to-right in English.
const sideOf=(from,to)=>(TABS.indexOf(to)>TABS.indexOf(from)?1:-1)*(LANG==='ar'?-1:1);
let sliding=false;
function slideTabs(from,to,startDx=0){
  const a=$('#'+from),b=$('#'+to),side=sideOf(from,to),ease='transform .34s cubic-bezier(.2,.8,.2,1)';
  sliding=true; b.hidden=false; b.classList.remove('in');
  if(!startDx) b.scrollTop=0;
  a.style.transition=b.style.transition='none';
  a.style.transform=`translateX(${startDx}px)`; b.style.transform=`translateX(calc(${side*100}% + ${startDx}px))`;
  void b.offsetWidth;
  a.style.transition=b.style.transition=ease;
  a.style.transform=`translateX(${-side*100}%)`; b.style.transform='translateX(0)';
  setNav(to);
  setTimeout(()=>{a.hidden=true;a.style.transform=a.style.transition=b.style.transform=b.style.transition='';sliding=false},350);
}
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.hidden=s.id!==id);
  const s=$('#'+id); s.classList.remove('in'); void s.offsetWidth; s.classList.add('in'); s.scrollTop=0;
  setNav(id);
}
function go(tab){
  const cur=curScreen();
  if(cur===tab&&TABS.includes(tab)){const s=$('#'+tab);s.scrollTo?s.scrollTo({top:0,behavior:'smooth'}):(s.scrollTop=0);return}
  renderTab(tab);
  if(TABS.includes(cur)&&TABS.includes(tab)&&!sliding){slideTabs(cur,tab);return}
  show(tab);
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{go(b.dataset.tab)});

/* Touch-down feedback: pressed look, sound and a light tick the moment a finger lands, not on release. */
const PRESSABLE='button,a.btn,.catbtn';
let pressEl=null,pressT=0,pressX=0,pressY=0;
function release(){const el=pressEl;pressEl=null;if(!el)return;const wait=Math.max(0,90-(performance.now()-pressT));setTimeout(()=>el.classList.remove('pressed'),wait)}
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest(PRESSABLE); if(!el||el.disabled||!app.contains(el)&&!el.closest('#admin')) return;
  pressEl=el;pressT=performance.now();pressX=e.clientX;pressY=e.clientY;el.classList.add('pressed');
  const kind=el.closest('#nav')||el.closest('.shtabs')||el.closest('.seg')?'tab':el.matches('.play,.btn-gold,.btn-wa,.pricebtn')?'big':el.matches('.opt')?'opt':'tap';
  SFX[kind](); vib(kind==='big'?12:6);
},{passive:true});
document.addEventListener('pointermove',e=>{if(pressEl&&Math.hypot(e.clientX-pressX,e.clientY-pressY)>12){pressEl.classList.remove('pressed');pressEl=null}},{passive:true});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,release,{passive:true}));

/* Swipe left/right between the four tab pages; the page follows the finger. */
(function swipe(){
  let st=null,suppress=0;
  const blocked=t=>t.closest('.shtabs,.ascroll,input,textarea,select,.avrow,.frrow,.sheet,.overlay');
  app.addEventListener('pointerdown',e=>{
    const cur=curScreen(); if(sliding||!TABS.includes(cur)||!$('#sheet').hidden||blocked(e.target)) return;
    st={x:e.clientX,y:e.clientY,t:performance.now(),cur,nb:null,dx:0,drag:false,id:e.pointerId};
  },{passive:true});
  app.addEventListener('pointermove',e=>{
    if(!st||e.pointerId!==st.id) return;
    const dx=e.clientX-st.x,dy=e.clientY-st.y;
    if(!st.drag){
      if(Math.abs(dx)<12) return;
      if(Math.abs(dx)<Math.abs(dy)*1.3){st=null;return}
      st.drag=true;
      const forward=LANG==='ar'?dx>0:dx<0, i=TABS.indexOf(st.cur)+(forward?1:-1);
      st.nb=TABS[i]||null;
      if(st.nb){renderTab(st.nb);const b=$('#'+st.nb);b.hidden=false;b.classList.remove('in');b.scrollTop=0;b.style.transition='none'}
      $('#'+st.cur).style.transition='none';
    }
    st.dx=st.nb?dx:dx*.25;
    const a=$('#'+st.cur);a.style.transform=`translateX(${st.dx}px)`;
    if(st.nb){const side=sideOf(st.cur,st.nb);$('#'+st.nb).style.transform=`translateX(calc(${side*100}% + ${st.dx}px))`}
  },{passive:true});
  const end=e=>{
    if(!st||e.pointerId!==st.id) return;
    const s0=st; st=null; if(!s0.drag) return;
    suppress=performance.now()+350;
    const w=app.clientWidth, v=s0.dx/Math.max(1,performance.now()-s0.t);
    if(s0.nb&&(Math.abs(s0.dx)>w*.26||(Math.abs(v)>.45&&Math.abs(s0.dx)>30))){SFX.tab();vib(6);slideTabs(s0.cur,s0.nb,s0.dx);return}
    const a=$('#'+s0.cur),ease='transform .28s cubic-bezier(.2,.8,.2,1)';
    a.style.transition=ease;a.style.transform='translateX(0)';
    if(s0.nb){const b=$('#'+s0.nb),side=sideOf(s0.cur,s0.nb);b.style.transition=ease;b.style.transform=`translateX(${side*100}%)`;setTimeout(()=>{b.hidden=true;b.style.transform=b.style.transition=''},300)}
    setTimeout(()=>{a.style.transform=a.style.transition=''},300);
  };
  app.addEventListener('pointerup',end,{passive:true});
  app.addEventListener('pointercancel',end,{passive:true});
  app.addEventListener('click',e=>{if(performance.now()<suppress){e.stopPropagation();e.preventDefault()}},true);
})();
function toast(msg){const x=document.createElement('div');x.className='toast';x.textContent=msg;app.appendChild(x);setTimeout(()=>x.remove(),2500)}
function openSheet(html,bind){const w=$('#sheet');w.innerHTML=`<div class="sheet" role="dialog"><div class="grab"></div>${html}</div>`;w.hidden=false;w.onclick=e=>{if(e.target===w)closeSheet()};bind&&bind(w)}
function closeSheet(){$('#sheet').hidden=true;$('#sheet').innerHTML='';if(M&&!M.dead)M.paused=false}
function copyText(txt,okMsg){
  const fallback=()=>{toast(txt.length>60?txt.slice(0,60)+'…':txt)};
  try{navigator.clipboard.writeText(txt).then(()=>toast(okMsg||t('copied')),fallback)}catch(e){fallback()}
}
function shareText(txt){
  try{if(window.QuizClashAndroid&&typeof QuizClashAndroid.share==='function'){QuizClashAndroid.share(txt);return}}catch(e){}
  if(navigator.share){navigator.share({text:txt}).catch(err=>{if(!err||err.name!=='AbortError')copyText(txt)});return}
  copyText(txt);
}

// Plays one question slot. A burn throws the question away and asks the slot's next candidate.
async function playSlot(make,opts){

function r3Cat(tac,cat,ex){
  const d=tac==='risk'?3:tac==='safe'?2:(Math.random()<.5?2:3);
  if(cat==='iq') return ()=>{const n=choice(['matrix','piece','odd','mirror']);return gen(n,n==='mirror'||n==='odd'?undefined:Math.max(2,d))};
  return ()=>pickOne(q=>q.c===cat&&q.d===d,ex)||pickOne(q=>q.c===cat&&q.d>=2,ex)||pickOne(q=>q.c===cat,ex)||(cat==='math'?gen('math',d):pickOne(q=>q.d===d&&q.c!=='puz',ex)||gen('math',2));
}
function r3Maker(tac,cat,ex){
  const g3=()=>{const ns=gens(['matrix','piece','odd','mix']);if(!ns.length)return pickOne(q=>q.d>=2&&q.c!=='puz',ex)||gen('math',3);const n=choice(ns);return gen(n,n==='odd'?undefined:3)};
  const g2=()=>{const ns=gens(['mix','math']);return ns.length?gen(choice(ns),2):pickOne(q=>q.d===2&&q.c!=='puz',ex)||gen('math',2)};
  if(tac==='risk') return i=>i<2?(pickOne(q=>q.d===3&&q.c!=='puz',ex)||g3()):g3();
  if(tac==='safe') return i=>i<2?(pickOne(q=>q.d===2&&q.c!=='puz',ex)||g2()):g2();
  if(cat==='iq') return ()=>{const n=choice(['matrix','piece','odd','mirror']);return gen(n,n==='mirror'||n==='odd'?undefined:3)};
  if(cat==='math') return ()=>gen('math',2);
  return ()=>pickOne(q=>q.c===cat&&q.d>=2,ex)||pickOne(q=>q.d===2&&q.c!=='puz',ex)||gen('math',2);
}

  battleShell(); setScores(false);
  const ex=M.ex, G1=M.ghost, L1=M.live&&M.live.refs;
  const oppLeft=()=>{if(L1&&M.opp.left()){M.oppLeft=true;return true}return false};
  const DF=M.diff||'n', TM=x=>Math.max(5,Math.round(x*(DIFFS[DF]?DIFFS[DF].time:1)));
  const kd=d=>DF==='x'?Math.min(3,d+1):DF==='h'&&Math.random()<.5?Math.min(3,d+1):d;
  const knowOr=d=>()=>{const dd=kd(d);return pickOne(q=>q.d===dd&&q.c!=='puz',ex)||pickOne(q=>q.d===d&&q.c!=='puz',ex)||gen('math',1)};
  const quick=()=>{const n=choice(['math','math','mix','stroop']);return gen(n,n==='mix'||n==='math'?1:undefined)};
  const vis2=()=>{const n=choice(['matrix','piece','mirror','memory','odd']);return gen(n,n==='matrix'||n==='piece'?2:undefined)};
  const fav=M.opp.kind==='ai'?M.opp.p.fav:'', mathQ=()=>gen('math',DF==='x'?2:1);
  // Teacher (academy) matches: round 1 = the teacher's subject, round 2 = general knowledge + one thinking question,
  // round 3 = the category the player picks.
  const T=M.opp.kind==='ai'&&!G1&&!L1, ALSO=T?(M.opp.p.also||[]):[];
  const favQ=d=>()=>{const dd=kd(d);
    if(ALSO.length&&Math.random()<.15){const q=pickOne(q=>ALSO.includes(q.c)&&q.d===dd,ex);if(q)return q}
    return pickOne(q=>q.c===fav&&q.d===dd,ex)||pickOne(q=>q.c===fav,ex)||pickOne(q=>ALSO.includes(q.c),ex)||(fav==='math'?gen('math',dd):knowOr(d)())};
  const genQ=d=>()=>{const dd=kd(d);return pickOne(q=>q.c!==fav&&!ALSO.includes(q.c)&&q.c!=='puz'&&q.d===dd,ex)||pickOne(q=>q.c!==fav&&q.c!=='puz',ex)||knowOr(d)()};
  const think=()=>Math.random()<.65?(pickOne(q=>q.c==='puz',ex)||vis2()):vis2();
  // Round 1
  setRound(T?t('tr1',{n:nm(CATS[fav]||CATS.gen)}):t('r1'),'bolt','',5); await step(roundIntro(1,T));
  const mathQ2=()=>gen('math',DF==='x'?3:2);
  const r1=G1?G1.r1.slice(0,5).map(e=>()=>fromRef(e[0],1)):L1?L1.r1.map(ref=>()=>fromRef(ref,1))
    :T?(fav==='math'?shuffle([favQ(1),favQ(1),favQ(1),mathQ,mathQ]):[favQ(1),favQ(1),favQ(1),favQ(1),favQ(1)])
    :shuffle([knowOr(1),knowOr(1),knowOr(1),knowOr(1),quick]);
  for(let i=0;i<r1.length;i++){
    const r=await playSlot(r1[i],{time:G1||L1?10:TM(10),idx:`${i+1}/5`,meFn:speedPts,opFn:speedPts,showOppPick:true,key:['r1',i],canBurn:!G1&&!L1});
    if(oppLeft()) break;
    M.rec.r1.push([r.q.ref,r.my==null?-1:r.my,r.myT==null?-1:Math.round(r.myT*10)]);
  }
  // Round 2
  setRound(T?t('tr2'):t('r2'),'brain','',3); await step(roundIntro(2,T));
  if(M.oppLeft) return finishMatch(false);
  const r2=G1?G1.r2.slice(0,3).map(e=>()=>fromRef(e[0],2)):L1?L1.r2.map(ref=>()=>fromRef(ref,2))
    :T?shuffle([genQ(2),genQ(2),think])
    :shuffle([()=>pickOne(q=>q.c==='puz',ex)||vis2(),knowOr(2),vis2]);
  for(let i=0;i<r2.length;i++){
    const r=await playSlot(r2[i],{time:G1||L1?20:TM(20),idx:`${i+1}/3`,meFn:()=>30,opFn:()=>30,showOppPick:true,key:['r2',i],canBurn:!G1&&!L1});
    if(oppLeft()) break;
    M.rec.r2.push([r.q.ref,r.my==null?-1:r.my,r.myT==null?-1:Math.round(r.myT*10)]);
  }
  if(M.oppLeft) return finishMatch(false);
  // Round 3
  setRound(T?t('tr3'):t('r3'),'flame','',3); await step(roundIntro(3,T));
  const tac=await chooseTactic(T);
  const mt=TACT[tac.me.t],ot=TACT[tac.op];
  M.rec.r3={t:tac.me.t,c:tac.me.cat||'',x:[]};
  const make3=T&&tac.me.cat?r3Cat(tac.me.t,tac.me.cat,ex):r3Maker(tac.me.t,tac.me.cat,ex);
  setRound(t('r3x',{t:t(mt.k)+(T&&tac.me.cat&&CATS[tac.me.cat]?' · '+nm(CATS[tac.me.cat]):'')}),mt.ic,mt.cls,3);
  $('#b-optac').innerHTML=`${esc(t('opp_chose',{n:M.opp.name}))} <span class="rpill ${ot.cls}" style="padding:3px 9px;font-size:12px">${I[ot.ic]}${t(ot.k)}</span>`;
  for(let i=0;i<3;i++){
    const r=await playSlot(()=>make3(i),{time:G1||L1?15:TM(15),idx:`${i+1}/3`,meFn:()=>mt.pts,opFn:()=>ot.pts,pen:mt.pen,opPen:ot.pen,showOppPick:false,key:['r3',i],canBurn:!G1&&!L1});
    if(oppLeft()) break;
    M.rec.r3.x.push([r.myOk?1:0,r.myT==null?-1:Math.round(r.myT*10)]);
  }
  $('#b-optac').innerHTML='';
  if(M.oppLeft) return finishMatch(false);
  // Tiebreak (not in friend challenges: a recording has no answer for it)
  let tries=0;
  while(!G1&&M.me===M.op&&tries<3){
    tries++; setRound(t('tb'),'target','t-safe',1); await step(roundIntro(4));
    const r=await playSlot(L1?()=>fromRef(L1.tb[tries-1],2):T?favQ(2):knowOr(2),{time:10,idx:'1/1',meFn:speedPts,opFn:speedPts,showOppPick:true,key:L1?['tb',tries-1]:null,canBurn:!L1});
    if(r.mePts===r.opPts&&r.mePts>0){if(r.myT<r.opT)M.me+=1;else if(r.opT<r.myT)M.op+=1;setScores()}
  }
  markSeen(M.log.map(x=>x.q.id).filter(Boolean));
  finishMatch(false);
}
function forfeit(){if(!M)return;M.dead=true;if(M.live)M.opp.leave();$('#overlay').hidden=true;finishMatch(true)}

function finishMatch(forfeited){
  const m=M; m.dead=true;
  const o=forfeited?'l':m.oppLeft?'w':m.me>m.op?'w':m.me<m.op?'l':'d';
  const corr=m.log.filter(x=>x.ok).length, before=S.rating, tBefore=tierOf(before), L0=levelInfo(S.xp).lv;
  let delta=0;
  if(m.live){ if(m.live.host) setTimeout(()=>{try{m.live.net.set('rooms/'+m.live.code+'/state','done')}catch(e){}},1500); }
  else if(!m.ghost){
    const E=1/(1+Math.pow(10,(m.opp.rating-S.rating)/400)), K=S.played<10?40:28;
    delta=Math.round(K*((o==='w'?1:o==='l'?0:.5)-E)); if(o==='w')delta=Math.max(delta,6); if(o==='l')delta=Math.min(delta,-4);
    S.rating=Math.max(0,S.rating+delta);
    const vs=S.vs[m.opp.p.id]||{w:0,l:0,d:0}; vs[o]++; S.vs[m.opp.p.id]=vs;
  }else{ S.doneCh.push(m.ghostTok||''); S.doneCh=S.doneCh.slice(-30); }
  const xp=forfeited?5:20+corr*4+(o==='w'?25:0);
  S.xp+=xp; S.played++;
  if(o==='w'){S.wins++;S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak)}else if(o==='l'){S.losses++;S.streak=0}else S.draws++;
  S.history.unshift({o,opp:m.opp.name,me:m.me,op:m.op,delta,ch:!!m.ghost,live:!!m.live,ts:Date.now(),bid:m.opp.kind==='ai'?m.opp.p.id:'',df:m.diff||''}); S.history=S.history.slice(0,30);
  const AC=academyAfter(m,o,forfeited);
  save();
  const tAfter=tierOf(S.rating),L1=levelInfo(S.xp).lv;
  renderResult({m,o,delta,xp,before,tBefore,tAfter,L1,lvUp:L1>L0,corr,forfeited,AC});
}

const FRAME_COL={gold:['#FFE38A','#C88A00'],fire:['#FFB13D','#FF3D3D'],neon:['#33E1FF','#FF3DCB'],diamond:['#E9FDFF','#7FB8FF']};
const loadImg=src=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src});
function svgImg(svg){
  return new Promise((res,rej)=>{
    if(!/xmlns=/.test(svg)) svg=svg.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"');
    const im=new Image(); im.onload=()=>res(im); im.onerror=rej;
    im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}
async function resultCard(R){

  // logo + wordmark

    x.beginPath(); x.arc(cx,cy,R0+14,0,Math.PI*2); x.fillStyle=g; x.fill();
    x.save(); x.beginPath(); x.arc(cx,cy,R0,0,Math.PI*2); x.clip();
    try{const im=av&&av.asset?await loadImg(av.asset):await svgImg(avatarSVG(av)); x.drawImage(im,cx-R0,cy-R0,R0*2,R0*2)}catch(e){x.fillStyle='#222a55';x.fillRect(cx-R0,cy-R0,R0*2,R0*2)}

  return c.toDataURL('image/png');
}

function openChallengeIntro(){
  openSheet(`<h3>${t('ch_t')}</h3><p class="lead">${t('ch_how')}</p><button class="btn btn-wa" id="ci-go">${I.wa}${t('ch_start')}</button>`,
  w=>w.querySelector('#ci-go').onclick=()=>{closeSheet();startMatch(null,{forChallenge:true})});
}
function openChallengeSend(m){
  const link=challengeLink(makeToken(m)), msg=t('ch_msg',{name:myName(),score:m.me});
  const wa='https://wa.me/?text='+encodeURIComponent(msg+'\n'+link);
  openSheet(`<h3>${t('ch_send_t')}</h3><p class="lead">${t('ch_send_p')}</p>
    <div class="chname"><input id="cs-name" maxlength="16" value="${esc(S.name)}" placeholder="${t('ch_name')}" aria-label="${t('ch_name')}"><button class="btn btn-blue" id="cs-name-ok" style="width:auto;padding:10px 16px">${t('save')}</button></div>
    <p class="chprev">${esc(msg)}</p>
    <a class="btn btn-wa" id="cs-wa" href="${wa}" target="_blank" rel="noopener">${I.wa}${t('ch_wa')}</a>
    <code class="chlink">${esc(link)}</code><button class="btn btn-ghost" id="cs-copy">${I.share}${t('ch_copy')}</button><p class="proto">${t('ch_note')}</p>`,
  w=>{
    w.querySelector('#cs-copy').onclick=()=>copyText(msg+'\n'+link);
    w.querySelector('#cs-name-ok').onclick=()=>{const v=w.querySelector('#cs-name').value.trim().slice(0,16);if(!v){toast(t('name_empty'));return}S.name=v;save();openChallengeSend(m)};
    w.querySelector('#cs-wa').onclick=e=>{try{if(window.QuizClashAndroid&&typeof QuizClashAndroid.shareWhatsApp==='function'){e.preventDefault();QuizClashAndroid.shareWhatsApp(msg+'\n'+link)}}catch(err){}};
  });
}
function checkIncomingChallenge(){
  const hr=location.hash||''; if(/^#r[A-Z0-9]{6}$/.test(hr)){if(!$('#s-battle').hidden)return;joinRoom(hr.slice(2),true);return}
  const h=location.hash||''; if(!h.startsWith('#c')) return;
  const tok=h.slice(2), rec=readToken(tok);
  if(!rec){toast(t('ch_bad'));return}
  if(S.doneCh.includes(tok)) return;
  addInbox({k:'c',tok,n:rec.n,s:rec.s,a:rec.a});
  const av=avById(rec.a);
  openSheet(`<div class="chhero"><span class="av op ${frameCls(FRAMES[rec.f]?rec.f:'')}">${avatarSVG(av)}</span><b>${esc(t('ch_in_t',{name:rec.n||'?'}))}</b><span class="sc num">${+rec.s||0}</span></div>
    <p class="lead">${t('ch_in_p',{score:+rec.s||0})}</p><div class="confirm-btns"><button class="btn btn-ghost" id="ch-no">${t('ch_later')}</button><button class="btn btn-wa" id="ch-yes">${I.swords}${t('ch_accept')}</button></div>`,
  w=>{w.querySelector('#ch-no').onclick=closeSheet;w.querySelector('#ch-yes').onclick=()=>{closeSheet();startMatch(null,{ghost:rec});if(M)M.ghostTok=tok}});
}

  g3:{pack:'pack_gulf',asset:'assets/avatars/paid_gulf/g3.webp'},

  l2:{pack:'pack_legends',asset:'assets/avatars/paid_legends/l2.webp'},
  l3:{pack:'pack_legends',asset:'assets/avatars/paid_legends/l3.webp'},
  l4:{pack:'pack_legends',asset:'assets/avatars/paid_legends/l4.webp'},
  l5:{pack:'pack_legends',asset:'assets/avatars/paid_legends/l5.webp'},
  l6:{pack:'pack_legends',asset:'assets/avatars/paid_legends/l6.webp'},
