const FRAMES={gold:'frames_pack',fire:'frames_pack',neon:'frames_pack',diamond:'frames_pack',legend:'earned_legend'};
const SOUNDS={classic:null,coin:'sounds_pack',darbuka:'sounds_pack',laser:'sounds_pack',cheer:'sounds_pack',magic:'sounds_pack'};
const EMOJI={gulf:['🐪','🦅','🌴','☕','🏝️'],hype:['🔥','😎','💪','🚀','⚡'],brain:['🧠','💡','🎯','🤓','📚'],royal:['👑','💎','🏆','✨','🥇']};
const owns=pid=>!pid||S.owned.includes(pid);
function avById(id){
  if(typeof id==='number') return MY_AVATARS[id]||MY_AVATARS[0];
  if(typeof id==='string'&&id[0]==='f') return MY_AVATARS[+id.slice(1)]||MY_AVATARS[0];
  return PREMIUM_AV[id]||MY_AVATARS[0];
}
const frameCls=f=>f&&FRAMES[f]?'fr-'+f:'';
const meAv=(extra='')=>`<span class="av ${frameCls(S.frame)}" ${extra}>${avatarSVG(myAv())}</span>`;
const oppAv=(o,extra='')=>{o=o||M.opp;return `<span class="av op ${frameCls(o.frame)}" ${extra}>${avatarSVG(o.av)}</span>`};
function popEmoji(sel,list){
  const c=$(sel); if(!c||!list||!list.length) return;
  const e=document.createElement('span'); e.className='emo'; e.textContent=list[Math.floor(Math.random()*list.length)];
  e.style.insetInlineStart=sel==='#b-mecard'?'6px':'auto'; e.style.insetInlineEnd=sel==='#b-opcard'?'6px':'auto';
  c.appendChild(e); setTimeout(()=>e.remove(),1500);
}
// Extra sound for the equipped correct-answer pack (layered on top of the base chime).
const RIGHT_SOUNDS={
  classic(){SFX.right()},
  coin(){if(!ac())return;tone({type:'square',f:988,dur:.08,vol:.06,lp:3200});tone({type:'square',f:1319,at:.07,dur:.38,vol:.06,lp:3200,rev:.2})},
  darbuka(){if(!ac())return;tone({f:110,f2:62,dur:.28,vol:.38});hiss({dur:.06,vol:.12,type:'lowpass',f:700});
    [.17,.26,.4].forEach((a,i)=>{hiss({at:a,dur:.045,vol:.2-(i*.03),f:2300+i*300,q:5});tone({f:700+i*60,at:a,dur:.04,vol:.04})});tone({f:98,f2:60,at:.5,dur:.3,vol:.3,rev:.2})},
  laser(){if(!ac())return;tone({type:'sawtooth',f:2200,f2:180,dur:.28,vol:.06,lp:4000,rev:.2});tone({type:'square',f:1600,f2:120,at:.1,dur:.24,vol:.03,lp:3000,rev:.3})},
  cheer(){if(!ac())return;for(let i=0;i<6;i++)hiss({at:i*.04,dur:.7,vol:.05,f:900+Math.random()*1400,q:3,a:.12,pan:Math.random()-.5,rev:.4});[523.25,659.25,783.99].forEach(f=>tone({type:'triangle',f,at:.05,dur:.6,vol:.04,rev:.4}))},
  magic(){if(!ac())return;[1046.5,1318.5,1568,2093,2637].forEach((f,i)=>bell(f,i*.05,.07,.9,(i-2)*.2,.6,2.01));hiss({at:.1,dur:.8,vol:.03,type:'highpass',f:9000,rev:.7,a:.2})},
};
function playRight(){const fn=RIGHT_SOUNDS[S.snd]||RIGHT_SOUNDS.classic;(S.snd&&S.snd!=='classic'&&owns(SOUNDS[S.snd]))?fn():SFX.right()}

/* ---------------- purchases ---------------- */
function grantOwned(id){if(!PACK_INFO[id]||S.owned.includes(id))return false;S.owned.push(id);save();return true}
function buyPack(id){
  
  if(NATIVE&&NATIVE.buy){NATIVE.buy(id);return}
  openSheet(`<h3>${t('buy_t')}</h3><p class="lead">${t('unlock_p',{p:t('pk_'+id)})}</p><div class="confirm-btns"><button class="btn btn-ghost" id="u-no">${t('cancel')}</button><button class="btn btn-gold" id="u-yes">${t('unlock')}</button></div>`,
  w=>{w.querySelector('#u-no').onclick=closeSheet;w.querySelector('#u-yes').onclick=()=>{closeSheet();window.QCNative.onOwned(id)}});
}
const priceOf=id=>PRICES[id]||(PACK_INFO[id]&&PACK_INFO[id].price)||'';

/* ---------------- shop screen ---------------- */
let shopTab='av';
function renderShop(){
  const tabs=[['av','tab_av'],['fr','tab_fr'],['snd','tab_snd'],['emo','tab_emo'],['burn','tab_burn']];
  const packHead=id=>`<div class="pkhead"><div><b>${t('pk_'+id)}</b><small>${t('pkd_'+id)}</small></div>${owns(id)?`<span class="owned">${I.check}${t('owned')}</span>`:`<button class="pricebtn" data-buy="${id}">${esc(priceOf(id))}</button>`}</div>`;
  let body='';
  if(shopTab==='av'){
    const tile=(id,a,pack)=>{const on=S.avId===id,lock=!owns(pack);return `<button class="avtile ${on?'on':''} ${lock?'locked':''}" data-av="${id}" data-pack="${pack||''}"><span class="av ${on?frameCls(S.frame):''}">${avatarSVG(a)}</span>${lock?`<span class="lock">${I.lock}</span>`:on?`<span class="eq">${t('equipped')}</span>`:''}</button>`};
    body=['pack_gulf','pack_legends'].map(p=>`<section class="pk card">${packHead(p)}<div class="avrow">${Object.entries(PREMIUM_AV).filter(([,a])=>a.pack===p).map(([id,a])=>tile(id,a,p)).join('')}</div></section>`).join('')
      +`<section class="pk card"><div class="pkhead"><div><b>${t('free')}</b></div></div><div class="avrow six">${MY_AVATARS.map((a,i)=>tile('f'+i,a,null)).join('')}</div></section>`;
  }else if(shopTab==='fr'){
    const p='frames_pack';
    body=`<section class="pk card">${packHead(p)}<div class="frrow">
      <button class="frtile ${!S.frame?'on':''}" data-fr=""><span class="av">${avatarSVG(myAv())}</span><small>${t('none')}</small></button>
      ${Object.keys(FRAMES).filter(f=>FRAMES[f]==='frames_pack').map(f=>`<button class="frtile ${S.frame===f?'on':''} ${owns(p)?'':'locked'}" data-fr="${f}"><span class="av fr-${f}">${avatarSVG(myAv())}</span><small>${t('fr_'+f)}</small>${owns(p)?'':`<span class="lock">${I.lock}</span>`}</button>`).join('')}</div></section>`;
  }else if(shopTab==='snd'){
    const p='sounds_pack';
    body=`<section class="pk card">${packHead(p)}<div class="sndlist">${Object.entries(SOUNDS).map(([k,pk])=>{const lock=!owns(pk),on=(S.snd||'classic')===k;
      return `<div class="sndrow ${on?'on':''}"><button class="play-s" data-play="${k}" aria-label="${t('preview')}">${I.playtri}</button><span><b>${t('snd_'+k)}</b><small>${t('sndd_'+k)}</small></span>${lock?`<span class="lock">${I.lock}</span>`:on?`<span class="owned">${I.check}${t('equipped')}</span>`:`<button class="btn btn-ghost eqbtn" data-snd="${k}">${t('equip')}</button>`}</div>`}).join('')}</div></section>`;
  }else if(shopTab==='emo'){
    body=`<p class="notice">${I.info}<span>${t('emo_note')}</span></p>`+Object.entries(EMOJI).map(([k,list])=>{const id='emoji_'+k,on=S.emo===k;
      return `<section class="pk card ${on?'eqd':''}">${packHead(id)}<button class="emorow" data-emo="${k}">${list.map(e=>`<span>${e}</span>`).join('')}</button>${owns(id)?`<button class="btn ${on?'btn-ghost':'btn-blue'} eqbtn wide" data-emoeq="${k}">${on?t('unequip'):t('equip')}</button>`:''}</section>`}).join('');
  }else{
    body=burnsHTML();
  }
  $('#s-shop').innerHTML=`<div class="page-h"><div><h1>${t('shop')}</h1><p>${t('shop_sub')}</p></div><button class="chip burns" id="sh-b">${I.flame}<span class="num">${S.burns}</span></button></div>
    <div class="shtabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" class="${shopTab===k?'on':''}" data-tab2="${k}">${t(l)}</button>`).join('')}</div>${body}`;
  const s=$('#s-shop');
  s.querySelectorAll('[data-tab2]').forEach(b=>b.onclick=()=>{shopTab=b.dataset.tab2;renderShop()});
  $('#sh-b').onclick=()=>{shopTab='burn';renderShop()};
  s.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buyPack(b.dataset.buy));
  s.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>{const pk=b.dataset.pack;if(pk&&!owns(pk)){buyPack(pk);return}S.avId=b.dataset.av;save();toast(t('equipped_t'));renderShop()});
  s.querySelectorAll('[data-fr]').forEach(b=>b.onclick=()=>{const f=b.dataset.fr;if(f&&!owns('frames_pack')){buyPack('frames_pack');return}S.frame=f;save();SFX.coin();renderShop()});
  s.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{const k=b.dataset.play;(RIGHT_SOUNDS[k]||SFX.right)()});
  s.querySelectorAll('[data-snd]').forEach(b=>b.onclick=()=>{S.snd=b.dataset.snd;save();playRight();renderShop()});
  s.querySelectorAll('[data-emo]').forEach(b=>b.onclick=()=>{const k=b.dataset.emo;const sp=b.children[Math.floor(Math.random()*b.children.length)];sp.classList.remove('bump');void sp.offsetWidth;sp.classList.add('bump');if(!owns('emoji_'+k))buyPack('emoji_'+k)});
  s.querySelectorAll('[data-emoeq]').forEach(b=>b.onclick=()=>{const k=b.dataset.emoeq;S.emo=S.emo===k?'':k;save();renderShop()});
  if(shopTab==='burn') bindBurns(s,renderShop);
}

const trRec=id=>(S.tr&&S.tr[id])||{w:0,x:0,at:{}};
function trTier(id){const r=trRec(id);if(r.w>=15&&r.x>=3)return 3;if(r.w>=15)return 2;if(r.w>=5)return 1;if(r.w>=1)return 0;return -1}
const trImg=(tier,cls='')=>`<img class="trimg ${cls}" src="assets/trophies/${tier<0?'bronze':TR_IMG[tier]}.webp" alt="" draggable="false">`;
function trReq(id){const r=trRec(id),tr=trTier(id);
  return tr<0?t('tr_req_b'):tr===0?t('tr_req_s',{n:r.w}):tr===1?t('tr_req_g',{n:r.w}):tr===2?t('tr_req_d',{n:Math.min(3,r.x)}):t('tr_req_max')}
function trPct(id){const r=trRec(id),tr=trTier(id);return tr<0?0:tr===0?r.w/5*100:tr===1?r.w/15*100:tr===2?Math.min(3,r.x)/3*100:100}
const legendDone=()=>{const av=availBots();return av.length>0&&av.every(b=>trTier(b.id)===3)};
const fmtDate=ts=>{try{return new Date(ts).toLocaleDateString(LANG==='en'?'en-GB':'ar-BH-u-nu-latn',{day:'numeric',month:'short',year:'numeric'})}catch(e){return ''}};

/* ---- daily challenges ---- */
const localDay=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const DAILY_POOL=[{id:'play3',n:3},{id:'correct10',n:10},{id:'win2',n:2},{id:'beat',n:1},{id:'hard',n:1},{id:'friend',n:1},{id:'streak5',n:1}];
function dailyState(){
  const day=localDay();
  if(!S.daily||S.daily.day!==day){
    let h=0;for(const c of day)h=(h*31+c.charCodeAt(0))|0;
    const r=mulberry32(h),pool=DAILY_POOL.slice(),list=[];
    while(list.length<3){list.push(pool.splice(Math.floor(r()*pool.length),1)[0].id)}
    const bots=availBots(); const tb=bots[Math.floor(r()*bots.length)];
    S.daily={day,list,tb:tb?tb.id:'t_his',p:{},cl:[]};
  }
  return S.daily;
}
const dailyDef=id=>DAILY_POOL.find(x=>x.id===id);
function dailyLabel(id){const d=dailyState();if(id==='beat'){const b=BOTS.find(x=>x.id===d.tb)||BOTS[0];return t('d_beat',{t:nm(b)})}return t('d_'+id)}
function dailyBump(id,n=1){const d=dailyState();if(!d.list.includes(id))return;d.p[id]=Math.min(dailyDef(id).n,(d.p[id]||0)+n)}
function dailyClaim(id){
  const d=dailyState();if(!d.list.includes(id)||d.cl.includes(id)||(d.p[id]||0)<dailyDef(id).n)return false;
  d.cl.push(id);S.burns+=1;S.xp+=40;save();SFX.big&&SFX.big();toast(t('daily_got'));return true;
}
function hoursLeft(){const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const mins=Math.max(1,Math.round((m-n)/60000));return mins>=60?t('m_ago_h',{n:Math.floor(mins/60)}):t('m_ago_m',{n:mins})}

/* ---- after every match: trophies, daily progress, online stats ---- */
function academyAfter(m,o,forfeited){
  const ev=[];
  if(!S.tr) S.tr={};
  // daily
  const finished=!forfeited;
  if(finished) dailyBump('play3');
  const corr=m.log.filter(x=>x.ok).length; if(corr) dailyBump('correct10',corr);
  let run=0,best=0; m.log.forEach(x=>{run=x.ok?run+1:0;best=Math.max(best,run)}); if(best>=5) dailyBump('streak5');
  if(o==='w'&&finished) dailyBump('win2');
  if(m.live||m.ghost) dailyBump('friend');
  if(m.live){S.on=S.on||{p:0,w:0,l:0,d:0};S.on.p++;S.on[o]++}
  if(m.opp.kind==='ai'&&o==='w'&&finished){
    const id=m.opp.p.id; if(!TROPHY[id]) return {events:ev};
    if(m.diff==='h'||m.diff==='x') dailyBump('hard');
    if(S.daily&&S.daily.tb===id) dailyBump('beat');
    const before=trTier(id), r=S.tr[id]||{w:0,x:0,at:{}};
    r.w++; if(m.diff==='x') r.x++; S.tr[id]=r;
    const after=trTier(id);
    if(after>before){for(let k=before+1;k<=after;k++) r.at[TR_KEY[k]]=Date.now(); ev.push({id,tier:after,up:before>=0});
      if(after>=0&&(!S.show||S.show.length<3)&&!(S.show||[]).includes(id)){S.show=(S.show||[]).concat(id).slice(0,3)}}
    if(after===3&&!S.legendAt&&legendDone()){S.legendAt=Date.now();if(!S.owned.includes('earned_legend'))S.owned.push('earned_legend');ev.push({legend:true})}
  }
  return {events:ev};
}
function trophyPop(events){
  if(!events.length) return;
  const e=events[0], rest=events.slice(1);
  const box=document.createElement('div'); box.className='trpop';
  if(e.legend){
    box.innerHTML=`<div class="trpop-in"><span class="trpop-rays"></span><img class="trpop-img" src="assets/trophies/legend.webp" alt=""><h2>${t('legend_got')}</h2><p>${t('legend_reward')}</p><small>${t('tr_tap')}</small></div>`;
  }else{
    const b=BOTS.find(x=>x.id===e.id);
    box.innerHTML=`<div class="trpop-in"><span class="trpop-rays"></span><span class="eyebrow">${e.up?t('tr_up'):t('tr_new')}</span>${trImg(e.tier,'trpop-img')}
      <span class="trpop-av av op">${avatarSVG(b.av)}</span><h2>${esc(trName(e.id))}</h2><p>${t('tr_'+TR_KEY[e.tier])} · ${esc(nm(b))}</p><small>${t('tr_tap')}</small></div>`;
  }
  app.appendChild(box); SFX.big&&SFX.big(); vib([40,30,80]); if(!reduce) confetti();
  const close=()=>{box.classList.add('out');setTimeout(()=>{box.remove();if(rest.length)trophyPop(rest)},260)};
  setTimeout(()=>box.onclick=close,500);
}

// Transport layer. In the Android app this is Firebase Realtime Database (with anonymous sign-in).
// netMode:'local' swaps in a localStorage transport so two tabs of one browser can play each other (used for testing).
function makeNet(){
  if(CFG.netMode==='local') return LocalNet();
  const fb=CFG.firebase;
  if(fb&&fb.apiKey&&fb.databaseURL&&window.firebase) return FirebaseNet(fb);
  return null;
}
let NET=null;
function getNet(){if(!NET)NET=makeNet();return NET}
function FirebaseNet(cfg){
  let db=null,offset=0,uid=null;
  return {
    async start(){
      if(uid) return uid;
      if(!firebase.apps.length) firebase.initializeApp(cfg);
      const cred=await firebase.auth().signInAnonymously(); uid=cred.user.uid;
      db=firebase.database();
      db.ref('.info/serverTimeOffset').on('value',s=>{offset=s.val()||0});
      return uid;
    },
    now:()=>Date.now()+offset,
    set:(p,v)=>db.ref(p).set(v),
    update:(p,v)=>db.ref(p).update(v),
    remove:p=>db.ref(p).remove(),
    get:async p=>(await db.ref(p).get()).val(),
    // Read a public node without signing in (used for the remote feature switches in config/).
    async peek(p){if(!firebase.apps.length) firebase.initializeApp(cfg);return (await firebase.database().ref(p).get()).val()},
    on(p,cb){const r=db.ref(p),h=s=>cb(s.val());r.on('value',h);return()=>r.off('value',h)},
    async claim(p,v){const res=await db.ref(p).transaction(cur=>cur===null?v:undefined);return !!res.committed},
    onDisconnect(p,v){db.ref(p).onDisconnect().set(v)},
    // Ordered read: asc → oldest first (queue), otherwise highest first (leaderboard).
    async top(p,child,n,asc){const q=db.ref(p).orderByChild(child);const s=await (asc?q.limitToFirst(n):q.limitToLast(n)).get();const out=[];s.forEach(c=>{out.push(Object.assign({id:c.key},c.val()))});return asc?out:out.reverse()},
  };
}
function LocalNet(){
  // Test transport: every tab keeps a copy of the tree and broadcasts each write to the other tabs.
  const uid='u'+Math.random().toString(36).slice(2,10), ch=new BroadcastChannel('qc.localnet');
  let tree={};
  const seg=p=>p.split('/').filter(Boolean);
  const at=(o,p)=>seg(p).reduce((x,k)=>x==null?null:(x[k]===undefined?null:x[k]),o);
  const put=(o,p,v)=>{const ks=seg(p);let x=o;ks.slice(0,-1).forEach(k=>{if(typeof x[k]!=='object'||x[k]===null)x[k]={};x=x[k]});if(v==null)delete x[ks[ks.length-1]];else x[ks[ks.length-1]]=JSON.parse(JSON.stringify(v))};
  const subs=new Set();
  const notify=()=>subs.forEach(s=>{const v=at(tree,s.p),j=JSON.stringify(v);if(j!==s.last){s.last=j;setTimeout(()=>s.cb(v&&JSON.parse(j)),0)}});
  const apply=(p,v)=>{put(tree,p,v);notify()};
  ch.onmessage=e=>{const m=e.data;if(m.op==='set')apply(m.p,m.v);else if(m.op==='hello')ch.postMessage({op:'snap',tree});else if(m.op==='snap'&&!Object.keys(tree).length){tree=m.tree;notify()}};
  ch.postMessage({op:'hello'});
  const set=async(p,v)=>{apply(p,v);ch.postMessage({op:'set',p,v:v===undefined?null:v})};
  return {
    start:async()=>{await wait(150);return uid}, now:()=>Date.now(),
    set, update:async(p,v)=>{for(const k in v)set(p+'/'+k,v[k])}, remove:p=>set(p,null),
    get:async p=>at(tree,p),
    on(p,cb){const s={p,cb,last:undefined};subs.add(s);const v=at(tree,p);s.last=JSON.stringify(v);setTimeout(()=>cb(v),0);return()=>subs.delete(s)},
    async claim(p,v){if(at(tree,p)!==null)return false;set(p,v);return true},
    onDisconnect(){},
    async top(p,child,n,asc){const o=at(tree,p)||{};const a=Object.keys(o).map(k=>Object.assign({id:k},o[k])).sort((x,y)=>(x[child]||0)-(y[child]||0));return (asc?a:a.reverse()).slice(0,n)},
  };
}

/* The live opponent: answers arrive from the other phone as they happen. */
class LiveOpponent{
  constructor(ctx){
    this.net=ctx.net;this.code=ctx.code;this.meUid=ctx.meUid;this.host=ctx.host;
    const o=ctx.oppInfo;this.oid=o.uid;this.name=(o.n||'?').slice(0,16);this.av=avById(o.a);this.frame=FRAMES[o.f]?o.f:'';this.emo=EMOJI[o.e]?o.e:'';this.tr=Array.isArray(o.tr)?o.tr:[];
    this.kind='live';this.rating=null;this.p={id:'live',fav:'gen'};
    this.room={};this.online=true;this.offSince=0;this.started=new Set();this.nextSeen=null;this.onNext=null;
    this.off=this.net.on('rooms/'+this.code,r=>this.onRoom(r||{}));
  }
  path(...a){return ['rooms',this.code,...a].join('/')}
  onRoom(r){
    this.room=r;
    const was=this.online;this.online=!(r.on&&r.on[this.oid]===false);
    if(!this.online&&was)this.offSince=Date.now(); if(this.online)this.offSince=0;
    // The host sets one shared start time for each question once both phones are ready for it.
    if(this.host){const rd=r.ready||{},st=r.start||{};for(const k in rd){if(rd[k]&&rd[k][this.meUid]&&rd[k][this.oid]&&!st[k]&&!this.started.has(k)){this.started.add(k);this.net.set(this.path('start',k),this.net.now()+900)}}}
    if(r.next&&r.next!==this.nextSeen){this.nextSeen=r.next;this.onNext&&this.onNext(r.next)}
  }
  k(key){return key?key[0]+'_'+key[1]:'x'}
  peek(key){const a=this.room.ans&&this.room.ans[this.k(key)];return a&&a[this.oid]||null}
  send(key,rec){return this.net.set(this.path('ans',this.k(key),this.meUid),rec)}
  async sync(key){
    const k=this.k(key),t0=Date.now();
    this.net.set(this.path('ready',k,this.meUid),true);
    for(;;){
      const st=this.room.start&&this.room.start[k];
      if(st){const w=st-this.net.now();if(w>0)await wait(Math.min(w,2500));return}
      if(this.left()||Date.now()-t0>15000) return;
      await wait(80);
    }
  }
  sendTactic(p){return this.net.set(this.path('tac',this.meUid),{t:p.t,c:p.cat||''})}
  async waitTactic(ms){const t0=Date.now();for(;;){const x=this.room.tac&&this.room.tac[this.oid];if(x)return x;if(Date.now()-t0>ms||this.left())return null;await wait(150)}}
  left(){return !this.online&&this.offSince&&Date.now()-this.offSince>6000}
  leave(){try{this.net.set(this.path('on',this.meUid),false)}catch(e){}}
  close(){try{this.off()}catch(e){}}
  decide(){return null}
  tactic(){return 'safe'}
}

const CODE_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const newCode=()=>Array.from({length:6},()=>CODE_ABC[Math.floor(Math.random()*CODE_ABC.length)]).join('');
const myInfo=uid=>({uid,n:myName().slice(0,16),a:S.avId,f:S.frame||'',e:owns('emoji_'+S.emo)?S.emo:'',rg:myRegion(),l:LANG,cc:myCountry(),tr:myShowcase()});
const roomLink=code=>GAME_URL+'#r'+code;
let LOBBY=null; // {code, unsub}
// Questions for a live room. qf = {rg: regions both players share, excl: categories switched off, langs: both players' languages}.
function roomRefs(qf){
  const prev=QF; QF={rg:qf.rg,excl:qf.excl||[],langs:qf.langs,mix:true,cc:qf.cc||''};
  try{
    const ex=new Set();
    const loose=f=>{const L=QF.langs;QF.langs=null;try{return pickOne(f,ex)}finally{QF.langs=L}};
    const know=d=>{const f=x=>x.d===d&&x.c!=='puz';const q=pickOne(f,ex)||loose(f)||pickOne(x=>x.c!=='puz',ex);return q?q.ref:gen(gens(['math'])[0]?'math':'mix',1).ref};
    const quick=()=>{const ns=gens(['math','math','mix','stroop']);if(!ns.length)return know(1);const n=choice(ns);return gen(n,n==='mix'||n==='math'?1:undefined).ref};
    const vis2=()=>{let ns=gens(['matrix','piece','mirror','memory','odd']);if(!ns.length)ns=gens(['mix','math']);if(!ns.length)return know(2);const n=choice(ns);return gen(n,['matrix','piece','mix','math'].includes(n)?2:undefined).ref};
    const puz=()=>{const q=pickOne(x=>x.c==='puz',ex)||loose(x=>x.c==='puz');return q?q.ref:vis2()};
    return {r1:shuffle([know(1),know(1),know(1),know(1),quick()]),r2:shuffle([puz(),know(2),vis2()]),tb:[know(2),know(2),know(2)]};
  }finally{QF=prev}
}
// Before creating a room: switch categories on/off for this match.
const TOG_CATS=['geo','sci','his','spo','tec','gen','khal','fan','lugha','cars','traffic','amth','puz','iq','color','math'];
function openCats(done){

    for(let i=0;i<5;i++){code=newCode();const base={v:2,created:net.now(),state:'open',host:myInfo(uid),excl};if(opt.inv){base.inv=opt.inv;base.ranked=true}if(await net.claim('rooms/'+code,base))break;code=null}
    if(!code) throw new Error('no code');
    net.set(`rooms/${code}/on/${uid}`,true); net.onDisconnect(`rooms/${code}/on/${uid}`,false);
  }catch(e){toast(t('on_err'));go('s-home');return}
  if(prevOpp){try{net.set(`rooms/${prevOpp.code}/next`,code)}catch(e){}}

  if(opt.inv) lobbyScreen(`<div><h2 class="mm-title">${t('rnd_found')}</h2><p class="mm-sub">${t('on_connecting')}</p></div><button class="quit" id="lb-cancel">${I.x}${t('cancel')}</button>`);
  else lobbyScreen(`<div><h2 class="mm-title">${t('lobby_t')}</h2><p class="mm-sub">${t('lobby_p')}</p></div>
    <div class="roomcode"><small>${t('lobby_code')}</small><b dir="ltr">${code}</b></div>
    <a class="btn btn-wa" id="lb-wa" href="${wa}" target="_blank" rel="noopener" style="max-width:320px">${I.wa}${t('ch_wa')}</a>
    <button class="btn btn-ghost" id="lb-copy" style="max-width:320px">${I.share}${t('ch_copy')}</button>
    <button class="quit" id="lb-cancel">${I.x}${t('cancel')}</button>`);
  if(!opt.inv) $('#lb-wa').onclick=e=>{try{if(window.QuizClashAndroid&&QuizClashAndroid.shareWhatsApp){e.preventDefault();QuizClashAndroid.shareWhatsApp(msg)}}catch(err){}};
  if(!opt.inv) $('#lb-copy').onclick=()=>copyText(msg);
  $('#lb-cancel').onclick=()=>{leaveLobby();go('s-home')};
  let started=false;
  const unsub=net.on('rooms/'+code,r=>{
    if(!r||started||!LOBBY||LOBBY.code!==code) return;
    if(r.guest&&r.guest.uid&&r.state==='open'){
      started=true; SFX.opp(); $('#s-match .mm-sub').textContent=t('lobby_joined',{n:r.guest.n||'?'});
      const hr=myRegion(),gr=RG_SETS[r.guest.rg]?r.guest.rg:hr;
      const qf={rg:RG_SETS[hr].filter(x=>RG_SETS[gr].includes(x)),cc:myCountry()&&r.guest.cc===myCountry()?myCountry():'',excl,langs:[...new Set([LANG,r.guest.l==='ar'||r.guest.l==='en'?r.guest.l:LANG])]};
      const refs=roomRefs(qf);
      net.update('rooms/'+code,{refs,qf,state:'play'});
      setTimeout(()=>{unsub();LOBBY=null;beginLive(net,code,uid,Object.assign({},r,{refs,qf}),true)},900);
    }
  });
  LOBBY={code,unsub,net,host:true};
  // A matched rival who never shows up: give up and search again.
  if(opt.inv) setTimeout(()=>{if(!started&&LOBBY&&LOBBY.code===code){leaveLobby();toast(t('rnd_none'));opt.onTimeout&&opt.onTimeout()}},15000);

}
async function joinRoom(code,fromLink,opt){
  opt=opt||{};
  const net=getNet(); if(!net) return openOnline();
  lobbyScreen(`<div><h2 class="mm-title">${t('on_connecting')}</h2></div>`);
  let uid,room;
  try{uid=await net.start();room=await net.get('rooms/'+code)}catch(e){toast(t('on_err'));go('s-home');return}
  if(!room||room.state==='closed'||room.state==='done'){toast(t('room_gone'));go('s-home');return}
  if(room.host&&room.host.uid===uid){toast(t('room_gone'));go('s-home');return}
  if(room.guest&&room.guest.uid!==uid){toast(t('room_full'));go('s-home');return}
  if(room.inv&&room.inv!==uid){toast(t('room_full'));go('s-home');return}
  const doJoin=async()=>{
    lobbyScreen(`<div><h2 class="mm-title">${t('on_connecting')}</h2></div>`);
    let ok=room.guest&&room.guest.uid===uid;
    try{if(!ok)ok=await net.claim(`rooms/${code}/guest`,myInfo(uid))}catch(e){ok=false}
    if(!ok){toast(t('room_full'));go('s-home');return}
    net.set(`rooms/${code}/on/${uid}`,true); net.onDisconnect(`rooms/${code}/on/${uid}`,false);
    lobbyScreen(`<div><h2 class="mm-title">${esc(t('invite_t',{n:room.host.n||'?'}))}</h2><p class="mm-sub">${t('lobby_wait_host')}</p></div>`);
    let started=false;
    const unsub=net.on('rooms/'+code,r=>{
      if(!r||started) return;
      if(r.state==='closed'){unsub();LOBBY=null;toast(t('room_gone'));go('s-home');return}
      if(r.state==='play'){started=true;unsub();LOBBY=null;beginLive(net,code,uid,r,false)}
    });
    LOBBY={code,unsub,net,host:false};
  };
  if(!fromLink) return doJoin();
  go('s-home');
  openSheet(`<div class="chhero"><span class="av op ${frameCls(FRAMES[room.host.f]?room.host.f:'')}">${avatarSVG(avById(room.host.a))}</span><b>${esc(t('invite_t',{n:room.host.n||'?'}))}</b><span class="live-chip">${t('live_tag')}</span></div>

}

/* ---------------- random matchmaking (switched on with CFG.matchmaking) ----------------
   Each searcher writes mm/q/{uid}. To pair, a searcher first reserves itself (room: 'pending'),
   creates a room reserved for the rival (inv), then claims the rival's queue entry with the room code.
   The rival sees the code on its own entry and joins. Claims are transactions, so two phones can't grab the same rival. */
let RAND=null;
function stopRandom(home){
  const st=RAND; RAND=null; if(!st) return;
  st.done=true; try{st.unsub&&st.unsub()}catch(e){} try{st.net.set('mm/q/'+st.uid,null)}catch(e){}
  if(home) go('s-home');
}
async function startRandom(){
  const net=getNet(); if(!net||!CFG.matchmaking) return openOnline();
  stopRandom(false);
  lobbyScreen(`<div><h2 class="mm-title">${t('rnd_search')}</h2><p class="mm-sub" id="rnd-sub">${t('m_random_p')}</p></div><button class="quit" id="rnd-x">${I.x}${t('cancel')}</button>`);
  $('#rnd-x').onclick=()=>stopRandom(true);
  let uid; try{uid=await net.start()}catch(e){toast(t('on_err'));go('s-home');return}
  if(CFG.ranked){try{const p=await net.get('players/'+uid);if(p&&typeof p.rating==='number'){S.orating=p.rating;save()}}catch(e){}}
  const qp='mm/q/'+uid, st={uid,net,done:false,unsub:null}; RAND=st;
  const me=Object.assign(myInfo(uid),{t:net.now(),r:S.orating||1000});
  try{await net.set(qp,me);net.onDisconnect(qp,null)}catch(e){toast(t('on_err'));stopRandom(true);return}
  // Someone paired with us: join their room.
  st.unsub=net.on(qp+'/room',code=>{
    if(st.done||RAND!==st||!code||code==='pending') return;
    st.done=true; RAND=null; try{st.unsub()}catch(e){} net.set(qp,null);
    joinRoom(code,false,{auto:true});
  });
  const t0=Date.now();
  while(!st.done&&RAND===st){
    const waited=Date.now()-t0, win=waited<8000?150:waited<20000?400:99999;
    if(waited>8000&&$('#rnd-sub')) $('#rnd-sub').textContent=t('rnd_wait');
    if(waited>60000){stopRandom(false);toast(t('rnd_none'));go('s-home');return}
    try{
      const now=net.now(), list=await net.top('mm/q','t',25,true);
      const shareLang=x=>x.l===LANG||(x.l==='ar'||x.l==='en');
      const cand=list.filter(x=>x.id!==uid&&!x.room&&now-(x.t||0)<90000&&Math.abs((x.r||1000)-me.r)<=win&&shareLang(x));
      for(const c of cand){
        if(st.done||RAND!==st) break;
        if(!(await net.claim(qp+'/room','pending'))) break; // we were just claimed; the listener takes over
        let paired=false;
        const code=await createRoom(null,[],{inv:c.id,
          onCode:async code=>{paired=await net.claim('mm/q/'+c.id+'/room',code);return paired},
          onTimeout:()=>{startRandom()}});
        if(paired&&code){st.done=true;RAND=null;try{st.unsub()}catch(e){}net.set(qp,null);return}
        try{await net.set(qp+'/room',null)}catch(e){}
        lobbyScreen(`<div><h2 class="mm-title">${t('rnd_search')}</h2><p class="mm-sub" id="rnd-sub">${t('rnd_wait')}</p></div><button class="quit" id="rnd-x">${I.x}${t('cancel')}</button>`);
        $('#rnd-x').onclick=()=>stopRandom(true);
      }
    }catch(e){}
    await wait(1400+Math.random()*1200);
  }
}

/* ---------------- ranked results ----------------
   Both phones report the final score from their own side to res/{code}/{uid}. A Cloud Function (functions/index.js)
   accepts the match only when the two reports agree, then updates ratings in players/{uid} and writes rated/{code}.
   Clients can't write players/ or rated/ (see database.rules.json). */
async function reportRanked(m){
  if(!m.live||!m.live.ranked||!CFG.ranked) return null;
  const net=m.live.net, uid=m.opp.meUid;
  try{await net.set(`res/${m.live.code}/${uid}`,{me:m.me,op:m.op,left:!!m.oppLeft,t:net.now()})}catch(e){return null}
  return new Promise(res=>{
    let done=false; const off=net.on('rated/'+m.live.code,r=>{if(done||!r)return;done=true;off();
      if(r.bad) return res({bad:true});
      const d=r[uid]; if(r.ratings&&typeof r.ratings[uid]==='number'){S.orating=r.ratings[uid];save()}
      res({delta:typeof d==='number'?d:0})});
    setTimeout(()=>{if(!done){done=true;try{off()}catch(e){}res(null)}},20000);
  });
}

/* ---------------- Android back button, pause, fx ---------------- */
// Android WebView: call window.quizBack() on back press; if it returns false, close the app.
window.quizBack=function(){
  const ad=$('.adscreen'); if(ad) return true;
  if(!$('#sheet').hidden){closeSheet();return true}
  const vis=[...document.querySelectorAll('.screen')].find(s=>!s.hidden),id=vis&&vis.id;
  if(id==='s-battle'){if($('#overlay').hidden)openQuit();return true}
  if(id==='s-match'){if(LOBBY)leaveLobby();if(M)M.dead=true;go('s-home');return true}
  if(id==='s-vs') return true;
  if(id==='s-home') return false;
  go('s-home'); return true;
};
document.addEventListener('keydown',e=>{if(e.key==='Escape')window.quizBack()});
document.addEventListener('visibilitychange',()=>{try{if(document.hidden&&AC)AC.suspend();else if(AC&&S.sound)AC.resume()}catch(e){}
  if(M&&!M.dead&&!M.live){if(document.hidden)M.paused=true;else if($('#sheet').hidden)M.paused=false}});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
(function stars(){
  const c=$('#stars'),x=c.getContext('2d');let W,H,st=[];
  const size=()=>{const r=c.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
    st=Array.from({length:Math.round(W*H/5200)},()=>({x:Math.random()*W,y:Math.random()*H*.75,r:Math.random()*1.3+.3,p:Math.random()*6.28,s:Math.random()*.02+.005}))};
  size(); addEventListener('resize',size);
  const draw=()=>{x.clearRect(0,0,W,H);for(const s of st){s.p+=s.s;x.globalAlpha=.35+.65*Math.abs(Math.sin(s.p));x.fillStyle='#CFE0FF';x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill()}if(!reduce)requestAnimationFrame(draw)};
  draw();
})();
function confetti(){
  if(reduce) return;
  const c=$('#confetti'),x=c.getContext('2d'),r=c.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);
  c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);
  const cols=['#FFC83D','#33E1FF','#FF3DCB','#8B5CFF','#2BE38B','#fff'];
  const ps=Array.from({length:150},()=>({x:r.width/2+(Math.random()*80-40),y:r.height*.25,vx:Math.random()*14-7,vy:-3-Math.random()*9,w:5+Math.random()*5,h:3+Math.random()*3,a:Math.random()*6,va:Math.random()*.6-.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  const f=n=>{const k=(n-t0)/1000;x.clearRect(0,0,r.width,r.height);for(const p of ps){p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.globalAlpha=Math.max(0,1-k/3);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}if(k<3)requestAnimationFrame(f);else x.clearRect(0,0,r.width,r.height)};
  requestAnimationFrame(f);
}
